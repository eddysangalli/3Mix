<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>3Mix Pro · Retornos de Externa (Return Feeds & N-1)</title>
<link rel="stylesheet" href="vmix-dialogo.css">
<style>
:root {
  --bg-dark: #12171b;
  --bg-card: #182026;
  --accent-cyan: #00cec9;
  --accent-green: #2ecc71;
  --accent-red: #e74c3c;
  --border-color: #2c3a47;
  --text-main: #ecf0f1;
  --text-dim: #95a5a6;
}
body.retornos-body {
  background: var(--bg-dark);
  color: var(--text-main);
  font-family: "Segoe UI", -apple-system, Tahoma, Arial, sans-serif;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  height: 100vh;
  user-select: none;
}
.retornos-header {
  background: #0d1117;
  padding: 10px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 2px solid var(--border-color);
}
.retornos-title {
  font-size: 15px;
  font-weight: 700;
  color: #fff;
  display: flex;
  align-items: center;
  gap: 10px;
}
.retornos-badge {
  background: #0984e3;
  color: #fff;
  font-size: 10px;
  font-weight: 800;
  padding: 2px 6px;
  border-radius: 2px;
}
.retornos-main {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
  gap: 16px;
  align-content: flex-start;
}
.feed-card {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: 4px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.3);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.feed-card.active {
  border-left: 4px solid var(--accent-green);
}
.feed-card.inactive {
  border-left: 4px solid #7f8c8d;
  opacity: 0.8;
}
.feed-head {
  padding: 8px 12px;
  background: #131a1f;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid #232c34;
}
.feed-name {
  font-weight: 700;
  font-size: 13px;
  color: #fff;
}
.feed-status {
  font-size: 11px;
  font-weight: 700;
}
.feed-status.online { color: var(--accent-green); }
.feed-status.offline { color: #7f8c8d; }
.feed-body {
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  font-size: 12px;
}
.feed-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.feed-label {
  color: var(--text-dim);
}
.feed-val {
  font-weight: 600;
  font-family: monospace;
}
.feed-badge-clean {
  background: #6c5ce7;
  color: #fff;
  padding: 2px 6px;
  border-radius: 3px;
  font-size: 10px;
  font-weight: 700;
}
.feed-badge-pgm {
  background: #e17055;
  color: #fff;
  padding: 2px 6px;
  border-radius: 3px;
  font-size: 10px;
  font-weight: 700;
}
.feed-badge-n1 {
  background: #00b894;
  color: #fff;
  padding: 2px 6px;
  border-radius: 3px;
  font-size: 10px;
  font-weight: 700;
}
.feed-foot {
  padding: 8px 12px;
  background: #141b21;
  display: flex;
  justify-content: space-between;
  border-top: 1px solid #232c34;
}
.btn-toggle {
  padding: 5px 12px;
  font-size: 11px;
  font-weight: 700;
  border-radius: 3px;
  cursor: pointer;
}
.btn-on { background: #27ae60; color: #fff; border: 1px solid #2ecc71; }
.btn-off { background: #c0392b; color: #fff; border: 1px solid #e74c3c; }
.btn-sec {
  background: #2c3a47;
  color: #d2dae2;
  border: 1px solid #485460;
  padding: 5px 10px;
  font-size: 11px;
  border-radius: 3px;
  cursor: pointer;
}
.btn-sec:hover { background: #3d4e5f; color: #fff; }
</style>
</head>
<body class="retornos-body">

<header class="retornos-header">
  <div class="retornos-title">
    <span>📡 CANAIS DE RETORNO (RETURN FEEDS)</span>
    <span class="retornos-badge">SRT CALLER/LISTENER + N-1 MIX-MINUS</span>
  </div>
  <div>
    <button class="btn-sec" id="btn-add-feed">+ Adicionar Canal de Retorno</button>
  </div>
</header>

<main class="retornos-main" id="feeds-grid">
  <div style="grid-column: 1 / -1; text-align: center; color: #7f8c8d; padding: 40px;">
    Carregando canais de retorno de externa…
  </div>
</main>

<script>
let feedsState = [];

async function fetchFeeds() {
  try {
    const res = await fetch('/api/return-feeds');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    feedsState = data.feeds || [];
    renderFeeds();
  } catch (err) {
    document.getElementById('feeds-grid').innerHTML = `<p style="color:#e74c3c">Falha ao buscar retornos: ${err.message}</p>`;
  }
}

function renderFeeds() {
  const container = document.getElementById('feeds-grid');
  if (!feedsState.length) {
    container.innerHTML = '<div style="grid-column: 1 / -1; text-align: center; color: #7f8c8d; padding: 40px;">Nenhum canal de retorno configurado no momento. Clique em "+ Adicionar Canal" acima.</div>';
    return;
  }

  container.innerHTML = feedsState.map(feed => {
    const isActive = feed.status === 'active' || feed.enabled;
    const isClean = feed.videoSource === 'CLEAN_FEED';
    const isN1 = feed.audioMode === 'MIX_MINUS_N1';

    return `
      <div class="feed-card ${isActive ? 'active' : 'inactive'}">
        <div class="feed-head">
          <span class="feed-name">${feed.name || 'Retorno'}</span>
          <span class="feed-status ${isActive ? 'online' : 'offline'}">
            ● ${isActive ? 'TRANSMITINDO' : 'PARADO'}
          </span>
        </div>
        <div class="feed-body">
          <div class="feed-row">
            <span class="feed-label">Protocolo / Porta:</span>
            <span class="feed-val">SRT :${feed.srtPort || 9000} (${feed.srtMode || 'listener'})</span>
          </div>
          <div class="feed-row">
            <span class="feed-label">Alvo / Destino:</span>
            <span class="feed-val">${feed.targetHost ? feed.targetHost + ':' + feed.targetPort : 'Aguardando Caller Remoto'}</span>
          </div>
          <div class="feed-row">
            <span class="feed-label">Origem de Vídeo:</span>
            <span>
              <span class="${isClean ? 'feed-badge-clean' : 'feed-badge-pgm'}">
                ${isClean ? '✨ CLEAN FEED (Sem GC)' : '📺 PROGRAM COMPLETO'}
              </span>
            </span>
          </div>
          <div class="feed-row">
            <span class="feed-label">Mixagem de Áudio:</span>
            <span>
              <span class="${isN1 ? 'feed-badge-n1' : 'feed-badge-pgm'}">
                ${isN1 ? '🎙️ N-1 (Sem Retorno Próprio)' : '🔊 MASTER PGM'}
              </span>
            </span>
          </div>
          <div class="feed-row">
            <span class="feed-label">Latência / Buffer:</span>
            <span class="feed-val">${feed.latencyMs || 120} ms</span>
          </div>
        </div>
        <div class="feed-foot">
          <button class="btn-toggle ${isActive ? 'btn-off' : 'btn-on'}" onclick="toggleFeed('${feed.id}', ${!isActive})">
            ${isActive ? '■ Desativar' : '▶ Ativar Sinal'}
          </button>
          <button class="btn-sec" onclick="toggleCleanFeed('${feed.id}', '${isClean ? 'PROGRAM' : 'CLEAN_FEED'}')">
            Alternar para ${isClean ? 'Program' : 'Clean Feed'}
          </button>
        </div>
      </div>
    `;
  }).join('');
}

async function toggleFeed(feedId, enable) {
  try {
    await fetch('/api/return-feeds', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        action: enable ? 'enable_feed' : 'disable_feed',
        feedId
      })
    });
    fetchFeeds();
  } catch (err) {
    alert('Erro: ' + err.message);
  }
}

async function toggleCleanFeed(feedId, videoSource) {
  try {
    await fetch('/api/return-feeds', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        action: 'configure_feed',
        feedId,
        updates: { videoSource }
      })
    });
    fetchFeeds();
  } catch (err) {
    alert('Erro: ' + err.message);
  }
}

document.getElementById('btn-add-feed').addEventListener('click', async () => {
  const name = prompt('Nome do canal de retorno (ex: Link Mochilink 2):', 'Retorno Externa ' + (feedsState.length + 1));
  if (!name) return;
  const port = prompt('Porta SRT (ex: 9002):', String(9000 + feedsState.length));
  if (!port) return;

  try {
    await fetch('/api/return-feeds', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        action: 'add_feed',
        feed: {
          name,
          srtPort: Number(port),
          srtMode: 'listener',
          videoSource: 'CLEAN_FEED',
          audioMode: 'MIX_MINUS_N1',
          latencyMs: 120,
          enabled: true
        }
      })
    });
    fetchFeeds();
  } catch (err) {
    alert('Erro: ' + err.message);
  }
});

fetchFeeds();
setInterval(fetchFeeds, 3000);
</script>
</body>
</html>
