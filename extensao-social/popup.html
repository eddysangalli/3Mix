<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 320px;
    background: #191c21;
    color: #e6edf3;
    font-family: 'Segoe UI', -apple-system, sans-serif;
    padding: 14px;
    font-size: 12px;
  }
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid #2d333b;
    padding-bottom: 10px;
    margin-bottom: 12px;
  }
  .title { font-weight: 800; font-size: 14px; color: #fff; }
  .title span { color: #2f6fed; }
  .status-badge {
    font-size: 10px;
    font-weight: 700;
    padding: 2px 6px;
    border-radius: 3px;
    background: #2a2e37;
    color: #8b949e;
  }
  .status-badge.online { background: #238636; color: #fff; }
  .status-badge.offline { background: #da3633; color: #fff; }

  .stats-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 12px;
  }
  .stat-card {
    background: #22272e;
    border: 1px solid #373e47;
    border-radius: 6px;
    padding: 8px 10px;
    text-align: center;
  }
  .stat-val { font-size: 18px; font-weight: 800; color: #fff; font-family: monospace; }
  .stat-lbl { font-size: 10.5px; color: #8b949e; margin-top: 2px; }

  .form-group {
    display: flex;
    flex-direction: column;
    gap: 4px;
    margin-bottom: 10px;
  }
  label { font-size: 11px; color: #8b949e; font-weight: 600; }
  input[type="text"] {
    background: #0d1117;
    border: 1px solid #30363d;
    color: #c9d1d9;
    padding: 6px 8px;
    border-radius: 4px;
    font-size: 11.5px;
    outline: none;
  }
  input[type="text"]:focus { border-color: #2f6fed; }

  .toggle-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .btn {
    background: #2f6fed;
    color: #fff;
    border: none;
    border-radius: 4px;
    padding: 7px 12px;
    font-size: 11.5px;
    font-weight: 700;
    cursor: pointer;
    width: 100%;
  }
  .btn:hover { background: #388bfd; }
  .note { font-size: 10px; color: #6e7681; margin-top: 8px; line-height: 1.3; }
</style>
</head>
<body>
  <div class="header">
    <div class="title">3Mix <span>SOCIAL CAPTURE</span></div>
    <span class="status-badge" id="status-badge">Verificando…</span>
  </div>

  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-val" id="count-yt">0</div>
      <div class="stat-lbl">YouTube Live</div>
    </div>
    <div class="stat-card">
      <div class="stat-val" id="count-tt">0</div>
      <div class="stat-lbl">TikTok Live</div>
    </div>
  </div>

  <div class="toggle-row">
    <span>Captura Ativa:</span>
    <input type="checkbox" id="chk-enabled" checked>
  </div>

  <div class="form-group">
    <label for="input-endpoint">Endpoint do 3Mix:</label>
    <input type="text" id="input-endpoint" value="http://127.0.0.1:3000">
  </div>

  <button type="button" class="btn" id="btn-save">Salvar Configurações</button>
  <div class="note">
    Abra qualquer Live no YouTube ou TikTok nesta aba do navegador. Os comentários entram diretamente na fila de moderação do 3Mix sem limites de cota da API.
  </div>

<script src="popup.js"></script>
</body>
</html>
