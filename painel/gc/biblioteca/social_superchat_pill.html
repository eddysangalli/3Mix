<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>3Mix · Alerta de SuperChat & PIX (DSK 1-4)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: transparent;
    font-family: 'Segoe UI', -apple-system, Roboto, sans-serif;
    user-select: none;
  }

  /* Posicionamento Topo Direito ou Canto Inferior */
  #pill-wrapper {
    position: absolute;
    top: 50px;
    right: 70px;
    perspective: 1000px;
    pointer-events: none;
  }

  .superchat-pill {
    display: flex;
    align-items: center;
    gap: 16px;
    background: linear-gradient(135deg, rgba(20, 24, 34, 0.94) 0%, rgba(30, 36, 52, 0.94) 100%);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1.5px solid rgba(245, 158, 11, 0.5);
    border-radius: 50px;
    padding: 8px 24px 8px 10px;
    box-shadow: 0 12px 35px rgba(245, 158, 11, 0.25), 0 4px 15px rgba(0, 0, 0, 0.7);
    color: #ffffff;
    opacity: 0;
    transform: translateY(-30px) scale(0.92);
    transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .superchat-pill.visible {
    opacity: 1;
    transform: translateY(0) scale(1);
  }

  .pill-avatar {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid #f59e0b;
    box-shadow: 0 0 12px rgba(245, 158, 11, 0.5);
    background: #181d29;
  }

  .pill-info {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .pill-row1 {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .pill-sender {
    font-size: 14px;
    font-weight: 700;
    color: #ffffff;
  }

  .pill-amount {
    font-size: 14px;
    font-weight: 800;
    color: #fcd34d;
    background: rgba(245, 158, 11, 0.2);
    padding: 2px 10px;
    border-radius: 20px;
    border: 1px solid rgba(245, 158, 11, 0.4);
    letter-spacing: 0.5px;
  }

  .pill-message {
    font-size: 13px;
    color: #e2e8f0;
    max-width: 400px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
</style>
</head>
<body>

<div id="pill-wrapper">
  <div id="superchat-pill" class="superchat-pill">
    <img id="sc-avatar" class="pill-avatar" src="" alt="Avatar">
    <div class="pill-info">
      <div class="pill-row1">
        <span id="sc-sender" class="pill-sender">Apoiador VIP</span>
        <span id="sc-amount" class="pill-amount">R$ 50,00</span>
      </div>
      <div id="sc-message" class="pill-message">Obrigado pelo conteúdo sensacional!</div>
    </div>
  </div>
</div>

<script>
  const pill = document.getElementById('superchat-pill');
  const avatar = document.getElementById('sc-avatar');
  const sender = document.getElementById('sc-sender');
  const amount = document.getElementById('sc-amount');
  const message = document.getElementById('sc-message');
  let hideTimer = null;

  function showSuperchat(data) {
    if (data.avatar) avatar.src = data.avatar;
    else avatar.src = 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="%23f59e0b"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>';

    sender.textContent = data.author || data.sender || 'Apoiador VIP';
    amount.textContent = data.amount || 'R$ 20,00';
    message.textContent = data.message || '';

    pill.classList.add('visible');

    if (hideTimer) clearTimeout(hideTimer);
    hideTimer = setTimeout(() => {
      pill.classList.remove('visible');
    }, 8000);
  }

  // WebSocket
  function connectWs() {
    const loc = window.location;
    const wsUrl = (loc.protocol === 'https:' ? 'wss://' : 'ws://') + (loc.host || '127.0.0.1:4455') + '/ws';
    try {
      const ws = new WebSocket(wsUrl);
      ws.onmessage = (e) => {
        try {
          const msg = JSON.parse(e.data);
          if (msg.event === 'SOCIAL_SUPERCHAT' && msg.data) {
            showSuperchat(msg.data);
          }
        } catch(err){}
      };
      ws.onclose = () => setTimeout(connectWs, 3000);
    } catch(err) {
      setTimeout(connectWs, 3000);
    }
  }

  window.updateFields = function(fields) {
    showSuperchat(fields);
  };

  connectWs();
</script>
</body>
</html>
