<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>3Mix · Multigravação</title>
<script>
// Compatibility URL: the multigravação window is /iso. The address this window was opened with is kept in the session
// so fechar-janela.js can ask the program to close the right window after the redirect.
(() => {
  try { if (!sessionStorage.getItem('freemix.panel.url')) sessionStorage.setItem('freemix.panel.url', location.href); } catch { /* storage off */ }
  location.replace('/iso' + location.search + location.hash);
})();
</script>
</head>
<body style="background:#202020"></body>
</html>
