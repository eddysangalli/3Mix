<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>3Mix · Recuperação</title>
<script src="3mix-padrao.js"></script>
<link rel="stylesheet" href="3mix-grafite.css">
<link rel="stylesheet" href="3mix-padrao.css">
<style>
  #candidate { padding: 14px 16px; background: #302511; border: 1px solid #6b5320; border-left: 3px solid var(--p3-warn); border-radius: 4px; display: flex; flex-direction: column; gap: 10px; }
  #candidate-title { font-weight: 700; color: #f0d9a5; font-size: 15px; }
  #candidate-detail { color: #e6d6ad; font-size: 13px; }
  .re-list { max-height: 320px; }
  .re-list input[type=radio] { display: block; }
  #backups tr { cursor: pointer; }
  #dependency-map { font: 12px/1.45 Consolas, monospace; }
  #remote-urls { font: 12px/1.45 Consolas, monospace; }
  .re-auto { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
  .re-auto .p3-field { flex: 0 0 170px; }
</style>
</head>
<body data-page="recuperacao" class="p3">
<header class="p3-head">
  <a href="/" title="3Mix"><img class="p3-logo" src="/img/3mix-logo.png" alt="3Mix"></a>
  <h1>Recuperação</h1>
  <span class="p3-flex"></span>
  <span id="connection" hidden></span>
</header>

<main class="p3-main">
  <p id="error" hidden role="alert"></p>

  <div id="candidate" hidden>
    <div id="candidate-title"></div>
    <p id="candidate-detail"></p>
    <div class="p3-row">
      <button type="button" id="candidate-select" class="primary">Escolher esta sessão</button>
      <button type="button" id="candidate-dismiss">Ignorar</button>
    </div>
  </div>

  <section class="p3-card">
    <div class="p3-card-head">
      <h2>Cópias salvas</h2>
      <span class="p3-row">
        <span id="current" class="p3-note"></span>
        <button type="button" id="refresh" class="small">Atualizar</button>
      </span>
    </div>
    <div class="p3-table-wrap re-list">
      <table>
        <thead><tr><th style="width:40px"></th><th>Produção</th><th style="width:28%">Data</th><th style="width:90px">Arquivos</th></tr></thead>
        <tbody id="backups"></tbody>
      </table>
    </div>

    <div class="p3-inline">
      <label class="p3-field">Nome da produção recuperada
        <input id="name" maxlength="80" placeholder="Ex.: Jogo de sábado (recuperado)" spellcheck="false">
      </label>
      <button type="button" id="restore" class="primary">Recuperar cópia</button>
    </div>

    <details>
      <summary>Opções da recuperação</summary>
      <div class="p3-row" style="margin-bottom:12px">
        <label class="p3-check"><input id="restore-profile" type="checkbox" checked> Trazer perfil de vídeo e saídas</label>
        <label class="p3-check"><input id="replay-journal" type="checkbox"> Refazer as ações registradas</label>
        <span class="p3-flex"></span>
        <button type="button" id="diagnose" class="small">Conferir arquivos</button>
        <button type="button" id="journal-plan" class="small">Ver ações registradas</button>
      </div>
      <textarea id="dependency-map" rows="2" placeholder='Trocar caminhos: {"D:\\antigo":"D:\\novo"}' hidden></textarea>
    </details>
    <pre id="report" class="p3-log" role="status"></pre>
  </section>

  <section class="p3-card">
    <h2>Salvar cópias</h2>
    <div class="re-auto">
      <label class="p3-check" style="height:38px"><input id="autosave-enabled" type="checkbox" checked> Automático</label>
      <label class="p3-field">A cada (segundos)<input id="autosave-interval" type="number" min="30" max="3600" value="60"></label>
      <label class="p3-field">Guardar (versões)<input id="autosave-retention" type="number" min="3" max="100" value="20"></label>
      <button type="button" id="autosave-save">Aplicar</button>
      <button type="button" id="checkpoint">Salvar versão agora</button>
      <span id="session-status" class="p3-note"></span>
    </div>

    <details>
      <summary>Cópia completa, com mídia</summary>
      <div class="p3-row" style="margin-bottom:12px">
        <label class="p3-check"><input id="include-media" type="checkbox"> Incluir mídia local (até 2 GB)</label>
        <label class="p3-check"><input id="materialize-remote" type="checkbox"> Baixar páginas remotas</label>
      </div>
      <label class="p3-field" style="margin-bottom:12px">Endereços remotos (um por linha)
        <textarea id="remote-urls" rows="2" placeholder="https://servidor/conteudo.html"></textarea>
      </label>
      <button type="button" id="backup">Criar cópia completa</button>
    </details>

    <details>
      <summary>Importar produção de outro computador</summary>
      <div class="p3-grid" style="margin-bottom:12px">
        <label class="p3-field">Pasta .fmx
          <input id="import-project-path" type="text" placeholder="C:\Projetos\UUID.fmx" spellcheck="false" autocomplete="off">
        </label>
        <label class="p3-field">Nome da produção
          <input id="import-project-name" type="text" maxlength="80" spellcheck="false">
        </label>
      </div>
      <div class="p3-row">
        <button type="button" id="import-project-preview">Conferir</button>
        <button type="button" id="import-project-apply" class="primary" disabled>Importar</button>
      </div>
      <pre id="import-project-report" class="p3-log" role="status" style="margin-top:12px"></pre>
    </details>
  </section>
</main>

<script src="fechar-janela.js"></script>
<script src="controle.js"></script>
<script src="recuperacao.js?v=20261101p"></script>
<script>
  // Clicar na linha escolhe a cópia, não só o círculo pequeno.
  document.getElementById('backups').addEventListener('click', (event) => {
    const radio = event.target.closest('tr')?.querySelector('input[type=radio]');
    if (radio && event.target !== radio && !radio.checked) { radio.checked = true; radio.dispatchEvent(new Event('change', { bubbles: true })); }
  });
</script>
</body>
</html>
