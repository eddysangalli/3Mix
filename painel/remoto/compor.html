<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>3Mix · Composições</title>
<script src="3mix-padrao.js"></script>
<link rel="stylesheet" href="3mix-grafite.css">
<link rel="stylesheet" href="3mix-padrao.css">
<link rel="stylesheet" href="compor.css?v=20261102a">
<style>
  /* A estrutura .workspace > section é o contrato de compor-galeria.js: ele coloca a galeria antes dela e troca estes títulos. */
  .workspace { display: grid; grid-template-columns: 320px minmax(0, 1fr); gap: 16px; align-items: start; }
  body[data-page="compor"] label { display: flex; flex-direction: column; gap: 6px; font-size: 13.5px; font-weight: 600; color: #ddd; min-width: 0; }
  svg#canvas { width: 100%; max-height: 42vh; background: #1a1a1a; border: 1px solid #414141; border-radius: 4px; display: block; }
  svg#canvas rect { fill: #2d2d2d; stroke: #2f6fed; stroke-width: 2.5; }
  svg#canvas text { fill: #fff; font: 700 28px "Segoe UI", sans-serif; }
  .slot { border: 1px solid #414141; border-radius: 4px; background: #1d1d1d; padding: 12px 14px; margin-bottom: 10px; }
  .coords { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; margin: 6px 0; }
  .p3 .coords input { width: 84px; }
  .p3 .coords select { width: auto; }
  #composition-tools, #composition-tools ~ .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .workspace form { display: flex; flex-direction: column; gap: 12px; }
  .compor-acoes { display: flex; align-items: flex-end; gap: 10px; flex-wrap: wrap; }
  .compor-acoes > label { flex: 1 1 240px; }
  /* Esquerda: escolher o modelo e criar. Direita: a composição aberta, com a imagem no alto. */
  .p3 main.p3-main { display: grid; grid-template-columns: minmax(380px, 470px) minmax(0, 1fr); gap: 14px; align-items: start; max-width: none; }
  #error { grid-column: 1 / -1; }
  .workspace, body[data-page="compor"] .workspace { display: contents; }
  #preset-library { grid-column: 1; margin: 0; padding: 14px 16px; background: var(--p3-panel); border: 1px solid var(--p3-line); border-radius: 4px; }
  .library-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
  #preset-total { color: var(--p3-dim); font-size: 12px; }
  .library-filters { grid-template-columns: repeat(2, minmax(0, 1fr)); margin-bottom: 10px; }
  #preset-cards { grid-template-columns: repeat(3, minmax(0, 1fr)); max-height: 46vh; gap: 6px; padding: 0 4px 0 0; }
  #preset-cards { overflow-x: hidden; }
  .p3 .preset-card { display: flex; flex-direction: column; align-items: stretch; justify-content: flex-start; width: 100%; min-width: 0; height: auto; min-height: 0; padding: 6px; gap: 4px; background: #1d1d1d; border: 1px solid var(--p3-line); border-radius: 4px; color: #eee; white-space: normal; text-align: center; }
  .p3 .preset-card:hover { background: #2a2a2a; border-color: #5a5a5a; }
  .p3 .preset-card.selected { padding: 6px; background: #20262f; border: 1px solid var(--p3-accent); }
  .preset-card canvas { display: block; width: 100%; height: 66px; object-fit: contain; flex: none; }
  .preset-card strong { font-size: 11.5px; font-weight: 600; line-height: 1.25; }
  .preset-card span { color: var(--p3-dim); font-size: 10.5px; }
  #preset-choice:empty { display: none; }
  .workspace > section:first-child { grid-column: 1; margin: 0; }
  .workspace > section:nth-child(2) { grid-column: 2; grid-row: 1 / span 3; margin: 0; display: flex; flex-direction: column; gap: 12px; }
  .workspace > section:nth-child(2) > * { order: 3; margin-top: 0; margin-bottom: 0; }
  .workspace > section:nth-child(2) > h2 { order: 0; }
  .workspace > section:nth-child(2) > .compor-acoes:first-of-type { order: 1; }
  .workspace > section:nth-child(2) > #canvas { order: 2; }
  svg#canvas { max-height: 62vh; }
  body[data-page="compor"] label:has(> input[type=checkbox]) { flex-direction: row; align-items: center; gap: 8px; font-weight: 500; }
  body[data-page="compor"] label:has(> input[type=checkbox]) > input { width: auto; height: auto; }
  .p3 #composition-frame-refresh { align-self: flex-start; width: auto; }
  .workspace p:empty { display: none; }
  .p3 details { border: 1px solid var(--p3-line); border-radius: 4px; padding: 8px 12px; }
  .p3 details summary { cursor: pointer; font-weight: 600; }
  .workspace.assigning:not(.created) > section:first-child { grid-column: 2; grid-row: 1 / span 3; }
  @media (max-width: 1000px) { .p3 main.p3-main { grid-template-columns: 1fr; } #preset-library, .workspace > section:first-child, .workspace > section:nth-child(2), .workspace.assigning:not(.created) > section:first-child { grid-column: 1; grid-row: auto; } }
</style>
</head>
<body data-page="compor" class="p3">
<header class="p3-head">
  <a href="/" title="3Mix"><img class="p3-logo" src="/img/3mix-logo.png" alt="3Mix"></a>
  <h1>Composições</h1>
  <span class="p3-flex"></span>
  <span id="connection">Conectando…</span>
</header>

<main class="p3-main">
  <p id="error" role="alert" hidden></p>

  <div class="workspace">
    <section class="p3-card">
      <h2>Criar entrada composta</h2>
      <form id="create">
        <label>Nome<input id="name" maxlength="60" value="Entrevista" spellcheck="false"></label>
        <label>Layout
          <select id="layout">
            <option value="2box">2 pessoas</option>
            <option value="3box">3 pessoas</option>
            <option value="4box">4 pessoas</option>
            <option value="vertical2box">Vertical · 2 pessoas</option>
            <option value="verticalpip">Vertical · PiP</option>
            <option value="pip">Picture in Picture</option>
            <option value="slides">Apresentador + slides</option>
          </select>
        </label>
        <label>Cor do fundo<input id="color" type="color" value="#101820"></label>
        <div id="new-slots"></div>
        <button class="primary" type="submit">Criar entrada</button>
        <p id="create-status" class="p3-note" role="status" aria-live="polite"></p>
      </form>
    </section>

    <section class="p3-card">
      <h2>Editar composição</h2>
      <div class="compor-acoes">
        <label>Entrada<select id="composition"></select></label>
        <button type="button" id="preview" class="primary">Preparar no Preview</button>
        <button type="button" id="undo">Desfazer posição</button>
      </div>
      <svg id="canvas" aria-label="Posições dos participantes"></svg>
      <div id="slots"></div>
      <div class="compor-acoes">
        <label>Categorias (separadas por vírgula)<input id="tags" spellcheck="false"></label>
        <button type="button" id="save-tags">Salvar categorias</button>
      </div>
      <p id="status" class="p3-note" role="status"></p>
    </section>
  </div>
</main>

<script src="fechar-janela.js"></script>
<script src="controle.js?v=20261102a"></script>
<script src="compor.js"></script>
<script src="compor-avancado.js?v=20261102b"></script>
<script src="compor-galeria.js?v=20261102b"></script>
</body>
</html>
