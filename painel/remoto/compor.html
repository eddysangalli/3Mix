<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Composições e MultiView</title>
<link rel="stylesheet" href="vmix-dialogo.css">
<style>
svg#canvas { width: 100%; max-height: 36vh; background: #0c0f14; border: 1px solid #283340; border-radius: 6px; display: block; margin: 8px 0 12px; }
svg#canvas rect { fill: #1e293b; stroke: #38bdf8; stroke-width: 2.5; }
svg#canvas text { fill: white; font: 700 28px "Segoe UI", sans-serif; }
.slot { border: 1px solid #232c38; border-radius: 6px; background: #11151c; padding: 12px 14px; margin-bottom: 10px; }
.coords { display: flex; gap: 12px; flex-wrap: wrap; align-items: end; margin: 6px 0; }
.coords label { display: flex; flex-direction: column; font-size: 12px; font-weight: 700; gap: 4px; color: #cbd5e1; }
.coords input { width: 80px; height: 28px; padding: 4px 8px; border: 1px solid #283340; border-radius: 4px; background: #0c0f14; color: #f8fafc; font-size: 12.5px; box-sizing: border-box; }
.coords select { height: 28px; padding: 4px 8px; border: 1px solid #283340; border-radius: 4px; background: #0c0f14; color: #f8fafc; font-size: 12.5px; }
#new-slots { display: flex; flex-direction: column; gap: 6px; margin: 8px 0; }
#new-slots label { display: flex; flex-direction: column; font-size: 12px; font-weight: 700; gap: 4px; color: #cbd5e1; }
#composition-tools, #composition-tools ~ .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 8px 0; }
#composition-tools button, #composition-tools ~ .row button { height: 28px; font-size: 12px; padding: 0 12px; border-radius: 4px; }
#composition-tools label, #composition-tools ~ .row label { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; }
details summary { cursor: pointer; font-weight: 700; color: #38bdf8; padding: 6px 0; outline: none; }
details summary:hover { color: #7dd3fc; }
</style>
</head>
<body data-page="compor" class="vd">
<div class="vd-window vd-fill">
  <div class="vd-strip">
    <span class="vd-title">Composições</span>
    <div class="vd-inline" style="gap:6px;margin-left:12px">
      <span style="font-weight:700">Entrada:</span>
      <select id="composition" class="vd-short" style="width:200px"></select>
      <button id="preview" class="vd-on">Preparar no Preview</button>
      <button id="undo">Desfazer Posição</button>
    </div>
    <span class="vd-flex"></span>
    <span id="connection" class="vd-note" style="font-size:11px">Conectando…</span>
  </div>

  <p id="error" class="vd-msg vd-error" hidden role="alert" style="margin:4px 12px"></p>

  <div class="vd-main">
    <!-- Barra lateral para criar nova composição -->
    <nav class="vd-side" aria-label="Criar Composição" style="width:240px;padding:8px">
      <div style="font-weight:700;font-size:11px;color:#9aa6b0;margin-bottom:6px">NOVA ENTRADA COMPOSTA</div>
      <form id="create">
        <div class="vd-row" style="grid-template-columns:50px 1fr;margin-bottom:4px">
          <span>Nome</span><input id="name" maxlength="60" value="Entrevista" spellcheck="false">
        </div>
        <div class="vd-row" style="grid-template-columns:50px 1fr;margin-bottom:4px">
          <span>Layout</span>
          <select id="layout">
            <option value="2box">2 Pessoas (Lado a Lado)</option>
            <option value="3box">3 Pessoas</option>
            <option value="4box">4 Pessoas (Grid)</option>
            <option value="vertical2box">Vertical · 2 pessoas</option>
            <option value="verticalpip">Vertical · PiP</option>
            <option value="pip">Picture in Picture</option>
            <option value="slides">Apresentador + Slides</option>
          </select>
        </div>
        <div class="vd-row" style="grid-template-columns:50px 1fr;margin-bottom:4px">
          <span>Fundo</span>
          <input id="color" type="color" value="#101820" style="height:22px;padding:1px;width:100%">
        </div>
        <div id="new-slots"></div>
        <button class="vd-on" type="submit" style="width:100%;margin-top:6px">+ Criar Entrada</button>
        <p id="create-status" class="vd-msg" role="status" aria-live="polite" style="margin:4px 0 0;font-size:11px"></p>
      </form>
    </nav>

    <!-- Painel central de edição visual e coordenadas dos slots -->
    <div class="vd-pane">
      <div class="vd-body">
        <svg id="canvas" aria-label="Posições dos participantes"></svg>
        <div id="slots" style="max-height:38vh;overflow-y:auto;padding-right:4px"></div>

        <div class="vd-row" style="margin-top:6px">
          <span>Categorias</span>
          <div class="vd-inline" style="flex:1">
            <input id="tags" placeholder="Tags separadas por vírgula" spellcheck="false" style="max-width:280px">
            <button id="save-tags">Salvar Categorias</button>
          </div>
        </div>

        <p id="status" class="vd-msg" role="status" style="margin-left:0"></p>
      </div>
    </div>
  </div>

  <div class="vd-bar">
    <span class="vd-flex"></span>
    <button id="close-btn" onclick="window.FreeMixClosePanel ? window.FreeMixClosePanel() : window.close()">Fechar</button>
  </div>
</div>

<script src="fechar-janela.js"></script>
<script src="controle.js"></script>
<script src="compor.js"></script>
<script src="compor-avancado.js"></script>
<script src="compor-galeria.js"></script>
</body>
</html>
