<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fontes de dados</title>
<link rel="stylesheet" href="vmix-dialogo.css">
<style>
.vd-status table { width: 100%; border-collapse: collapse; }
.vd-status th, .vd-status td { padding: 6px 10px; border: 1px solid #2d2d2d; text-align: left; font-size: 12px; }
.vd-status th { background: #1c1c1c; color: #94a3b8; font-weight: 700; position: sticky; top: 0; z-index: 1; }
.vd-status td input { background: #101010; color: #f8fafc; border: 1px solid #343434; border-radius: 3px; padding: 4px 8px; font-size: 12px; width: 100%; box-sizing: border-box; }
.vd-status td input:focus { background: #2d2d2d; border-color: #2f6fed; outline: none; box-shadow: 0 0 0 2px rgba(47, 111, 237, 0.2); }
#data-mapping label { display: inline-flex; align-items: center; gap: 6px; background: #1c1c1c; padding: 4px 8px; font-size: 12px; border: 1px solid #343434; border-radius: 4px; }
#data-mapping select, #data-mapping input { height: 26px; font-size: 12px; width: auto; max-width: 160px; background: #101010; color: #fff; border: 1px solid #343434; border-radius: 3px; }
details summary { cursor: pointer; font-weight: 700; color: #2f6fed; padding: 6px 0; outline: none; }
details summary:hover { color: #7dd3fc; }
</style>
</head>
<body data-page="dados" class="vd">
<div class="vd-window vd-fill">
  <div class="vd-strip">
    <div class="vd-row" style="flex:1;grid-template-columns:80px minmax(180px,1fr) auto">
      <span>Tabela</span>
      <select id="data-source"></select>
      <div class="vd-inline" style="gap:4px">
        <button id="data-previous" title="Linha anterior">◀</button>
        <label class="vd-check" style="gap:2px">Linha <input id="data-row" type="number" min="1" value="1" style="width:48px;height:22px;text-align:center"></label>
        <button id="data-select">Ir</button>
        <button id="data-next" title="Próxima linha">▶</button>
        <button id="data-refresh" title="Recarregar dados da fonte">&#8635;</button>
      </div>
    </div>
    <span class="vd-flex"></span>
    <span id="data-status" class="vd-note" style="font-size:11px"></span>
    <span id="connection" hidden></span>
  </div>

  <div class="vd-body" style="padding-bottom:2px">
    <div class="vd-row">
      <span>Gerenciar</span>
      <div class="vd-inline" style="gap:6px">
        <button id="data-people">Nova Lista de Pessoas</button>
        <button id="data-add-row">+ Registro</button>
        <button id="data-delete-row" class="vd-warn">Excluir Linha</button>
        <button id="data-move">Mudar Escopo</button>
        <button id="data-delete" class="vd-warn">Excluir Tabela</button>
      </div>
    </div>

    <details class="vd-advanced">
      <summary>Adicionar Nova Fonte (Excel, CSV, Google Sheets, URL, JSON)</summary>
      <div class="vd-row"><span>Nome</span><input id="data-name" value="Tabela" spellcheck="false"></div>
      <div class="vd-row"><span>Guardar em</span>
        <select id="data-scope">
          <option value="project">Esta produção</option>
          <option value="global">Todas as produções</option>
        </select>
      </div>
      <div class="vd-row"><span>Formato</span>
        <div class="vd-inline">
          <select id="data-format" class="vd-short">
            <option value="csv">CSV</option>
            <option value="json">JSON</option>
            <option value="xlsx">Excel XLSX</option>
          </select>
          <span style="font-weight:700">Separador:</span>
          <select id="data-delimiter" class="vd-short" style="width:90px">
            <option value=",">Vírgula (,)</option>
            <option value=";">Ponto e vírgula (;)</option>
          </select>
        </div>
      </div>
      <div class="vd-row"><span>Aba / Caminho</span>
        <div class="vd-inline">
          <input id="data-sheet" placeholder="Aba Excel (opcional)" spellcheck="false">
          <input id="data-path" placeholder="Caminho JSON (ex: resultado.linhas)" spellcheck="false">
        </div>
      </div>
      <div class="vd-row"><span>Arquivo Local</span>
        <div class="vd-inline">
          <input id="data-local" placeholder="C:\Dados\placar.csv" spellcheck="false">
          <button id="data-file">Conectar Arquivo</button>
          <input id="data-upload" type="file" accept=".csv,.json,.xlsx" style="display:none">
          <button type="button" onclick="document.getElementById('data-upload').click()">Carregar Arquivo...</button>
        </div>
      </div>
      <div class="vd-row"><span>Endereço URL</span>
        <div class="vd-inline">
          <input id="data-url" type="url" placeholder="https://... ou exportação CSV pública do Google Sheets" spellcheck="false">
          <label class="vd-check">A cada <input id="data-interval" type="number" min="1" max="3600" value="5" style="width:48px"> s</label>
          <button id="data-http">Conectar Endereço</button>
        </div>
      </div>
      <div class="vd-row"><span>Texto Direto</span>
        <textarea id="data-text" placeholder="nome,cargo&#10;Maria,Apresentadora" style="height:60px;width:100%;font:12px Consolas,monospace;background:#0c0f14;color:#f8fafc;border:1px solid #283340;border-radius:4px;padding:6px;box-sizing:border-box;outline:none"></textarea>
      </div>
      <div class="vd-row"><span></span>
        <div class="vd-right"><button id="data-import">Importar Texto</button></div>
      </div>
    </details>
  </div>

  <div class="vd-status vd-grow" style="margin: 4px 12px; min-height: 160px; overflow: auto;">
    <div id="data-table"></div>
  </div>

  <div class="vd-body" style="padding-top:4px">
    <div class="vd-row">
      <span>Vínculo com GC</span>
      <div class="vd-inline">
        <select id="data-kind" class="vd-short" style="width:200px">
          <option value="person">Pessoa → Preview, Call e Tarja</option>
          <option value="lower">Tarja</option>
          <option value="score">Placar</option>
          <option value="text">Fonte de texto</option>
          <option value="browser">Template HTML</option>
          <option value="variables">Variáveis da produção</option>
          <option value="inputName">Nome de entrada</option>
        </select>
        <span id="data-target-label" hidden style="display:inline-flex;align-items:center;gap:4px">
          Destino: <select id="data-target" class="vd-short"></select>
        </span>
        <label class="vd-check"><input id="data-auto" type="checkbox"> Auto-Publicar</label>
      </div>
    </div>
    <div class="vd-row">
      <span>Mapeamento</span>
      <div class="vd-inline" style="flex-wrap:wrap">
        <div id="data-mapping" class="vd-inline" style="flex-wrap:wrap;gap:6px"></div>
        <button id="data-add-mapping" hidden>+ Campo</button>
      </div>
    </div>
    <pre id="data-preview" hidden></pre>
    <p id="message" class="vd-msg" role="status"></p>
  </div>

  <div class="vd-bar">
    <button id="data-bind">Salvar Vínculos</button>
    <button id="data-publish">Enviar ao GC</button>
    <button id="data-on" class="vd-air">Colocar no Ar</button>
    <span class="vd-flex"></span>
    <button id="close-btn" onclick="window.FreeMixClosePanel ? window.FreeMixClosePanel() : window.close()">Fechar</button>
  </div>
</div>
<script src="controle.js"></script>
<script src="fechar-janela.js"></script>
<script src="dados.js"></script>
</body>
</html>
