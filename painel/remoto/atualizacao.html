<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>3Mix · Atualizações</title>
<script src="3mix-padrao.js"></script>
<link rel="stylesheet" href="3mix-grafite.css">
<link rel="stylesheet" href="3mix-padrao.css">
</head>
<body data-page="atualizacao" class="p3">
<header class="p3-head">
  <a href="/" title="3Mix"><img class="p3-logo" src="/img/3mix-logo.png" alt="3Mix"></a>
  <h1>Atualizações</h1>
</header>

<main class="p3-main">
  <section class="p3-card" style="max-width:820px">
    <div class="p3-card-head">
      <h2>Versão instalada</h2>
      <span id="status" class="p3-note" role="status"></span>
    </div>
    <pre id="details" class="p3-log"></pre>
    <div class="p3-row">
      <button type="button" id="check" class="primary">Procurar atualização</button>
      <button type="button" id="download" disabled>Baixar pacote</button>
    </div>
    <details>
      <summary>Endereço das atualizações</summary>
      <label class="p3-field" style="margin-bottom:12px">Endereço HTTPS
        <input id="feed" type="url" placeholder="https://servidor/feed.json" autocomplete="off" spellcheck="false">
      </label>
      <div class="p3-row">
        <button type="button" id="configure">Salvar</button>
        <button type="button" id="disable" class="quiet">Remover</button>
      </div>
    </details>
  </section>
</main>

<script src="fechar-janela.js"></script>
<script src="atualizacao.js?v=20261101p"></script>
</body>
</html>
