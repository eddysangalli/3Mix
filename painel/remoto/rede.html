<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>3Mix · Rede Multipath</title>
<script src="3mix-padrao.js"></script>
<link rel="stylesheet" href="3mix-grafite.css">
<link rel="stylesheet" href="3mix-padrao.css">
<style>
  #message:empty { display: none; }
  .rd-checks { display: flex; flex-wrap: wrap; gap: 8px 18px; }
  .rd-checks label { display: flex; align-items: center; gap: 7px; font-size: 13.5px; color: #ddd; }
  .rd-checks input { width: auto; height: auto; }
  .rd-tabela { overflow: auto; border: 1px solid var(--p3-line); border-radius: 4px; }
  .rd-tabela table { width: 100%; border-collapse: collapse; }
  .rd-tabela th, .rd-tabela td { padding: 6px 8px; text-align: left; border-bottom: 1px solid var(--p3-line-soft); font-size: 12.5px; }
  .rd-tabela th { background: #1d1d1d; color: #bbb; font-weight: 700; }
  .rd-tabela tr:last-child td { border-bottom: 0; }
  .p3 .rd-tabela td input { width: 100%; min-width: 70px; height: 30px; }
  .p3 .rd-tabela td button { height: 30px; }
  .rd-barra { position: sticky; bottom: 0; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 10px 0; background: var(--p3-bg, #202020); border-top: 1px solid var(--p3-line); }
  .p3 #stop:not(:disabled) { background: #b02a1f; border-color: #d8392b; color: #fff; }
  #stats { max-height: 260px; }
  .rd-um { max-width: 260px; }
</style>
</head>
<body data-page="rede" class="p3">
<header class="p3-head">
  <a href="/" title="3Mix"><img class="p3-logo" src="/img/3mix-logo.png" alt="3Mix"></a>
  <h1>Rede Multipath</h1>
  <span class="p3-flex"></span>
  <span id="connection" class="p3-badge">Carregando…</span>
</header>
<main class="p3-main">
  <p id="message" class="p3-note" role="status"></p>

  <section class="p3-card">
    <h2>Transporte</h2>
    <div class="p3-grid">
      <label class="p3-field">Papel<select id="role"><option value="both">Emissor e receptor local (teste)</option>
            <option value="sender">Emissor</option>
            <option value="receiver">Receptor</option></select></label>
      <label class="p3-field">Modo<select id="mode"><option value="duplicate">Duplicação / redundância</option>
            <option value="aggregate">Agregação / ponderada</option></select></label>
      <label class="p3-field">FEC XOR<select id="fecGroup"><option value="0">Desativado</option>
            <option value="2">1 paridade a cada 2 pacotes (50%)</option>
            <option value="4">1 paridade a cada 4 pacotes (25%)</option>
            <option value="8">1 paridade a cada 8 pacotes (12,5%)</option>
            <option value="16">1 paridade a cada 16 pacotes (6,25%)</option></select></label>
      <label class="p3-field">Jitter / buffer (ms)<input id="latencyMs" type="number" min="20" max="2000"></label>
      <label class="p3-field">Limite (Mbps)<input id="maxMbps" type="number" min="1" max="200"></label>
      <label class="p3-field">Janela (pacotes)<input id="window" type="number" min="64" max="8192"></label>
      <label class="p3-field">Chave AES<input id="secret" type="password" autocomplete="off" placeholder="Vazia mantém a atual"></label>
    </div>
  </section>

  <section class="p3-card">
    <h2>Portas</h2>
    <div class="p3-grid">
      <label class="p3-field">Host receptor<input id="receiverHost" type="text" value="127.0.0.1"></label>
      <label class="p3-field">Porta do receptor<input id="receiverPort" type="number" min="1024" max="65535"></label>
      <label class="p3-field">Entrada TS<input id="ingestPort" type="number" min="1024" max="65535"></label>
      <label class="p3-field">Saída TS local<input id="outputPort" type="number" min="1024" max="65535"></label>
      <label class="p3-field">Bridge SRT local<input id="bridgePort" type="number" min="1024" max="65535"></label>
    </div>
  </section>

  <section class="p3-card">
    <h2>Recuperação e saúde</h2>
    <div class="rd-checks">
      <label><input id="retransmit" type="checkbox" checked>NACK autenticado</label>
      <label><input id="adaptive" type="checkbox">Saúde adaptativa</label>
      <label><input id="measureMedia" type="checkbox">Medir perda original</label>
      <label><input id="measuredAllocation" type="checkbox">Alocar por banda medida</label>
      <label><input id="bridge" type="checkbox">Bridge SRT local</label>
    </div>
    <div class="rd-um">
      <label class="p3-field">Tempo limite da sonda (ms)<input id="adaptiveTimeoutMs" type="number" min="1000" max="15000" value="2500"></label>
    </div>
  </section>

  <section class="p3-card">
    <div class="p3-row"><h2>Caminhos</h2><span class="p3-flex"></span><span id="interfaces" class="p3-note"></span><button id="add" type="button">Adicionar caminho</button></div>
    <div class="rd-tabela">
      <table>
        <thead><tr><th>IPv4 do receptor</th><th>Porta</th><th>IPv4 da interface local</th><th>Peso (1–100)</th><th></th></tr></thead>
        <tbody id="paths"></tbody>
      </table>
    </div>
    <p id="receiver-file" class="p3-note"></p>
  </section>

  <details class="p3-card">
    <summary>Diagnóstico em tempo real</summary>
    <pre id="stats" class="p3-log"></pre>
  </details>

  <div class="rd-barra">
    <button id="start" type="button" class="primary">Iniciar transporte</button>
    <button id="stop" type="button" disabled>Parar</button>
    <span class="p3-flex"></span>
    <button id="measure" type="button" disabled title="Teste de vazão até 64 Mbps">Medir banda</button>
    <button id="export" type="button" title="Gera o pacote do receptor">Exportar receptor</button>
    <button id="save" type="button">Salvar</button>
  </div>
</main>
<script src="fechar-janela.js"></script>
<script src="rede.js"></script>
</body>
</html>
