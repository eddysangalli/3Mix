<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>3Mix Pro · MultiView Broadcast</title>
  <link rel="stylesheet" href="3mix-tipografia.css">
  <link rel="stylesheet" href="controle.css">
  <style>
    :root {
      --pv-color: #00e676;
      --pgm-color: #ff3b30;
      --overlay-color: #ff9500;
      --card-bg: #14181c;
      --border-color: #2e3742;
      --accent-blue: #00a3ff;
    }
    body {
      background: #090c0e;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      user-select: none;
    }
    header {
      padding: 8px 16px;
      background: #0d1217;
      border-bottom: 1px solid #242c35;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex: none;
      z-index: 30;
      gap: 12px;
    }
    .mv-brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 800;
      font-size: 15px;
      color: #fff;
      letter-spacing: 0.5px;
    }
    .mv-badge {
      background: #1c242c;
      border: 1px solid #3b4754;
      color: #00e676;
      font-size: 11.5px;
      padding: 3px 8px;
      border-radius: 3px;
      font-weight: 900;
    }
    .status-badge {
      font-size: 11.5px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 3px;
      background: #242b33;
      color: #94a3b8;
    }
    .status-badge.online {
      background: rgba(0, 230, 118, 0.15);
      color: #00e676;
      border: 1px solid rgba(0, 230, 118, 0.4);
    }
    .status-badge.reconnecting {
      background: rgba(255, 149, 0, 0.15);
      color: #ff9500;
      border: 1px solid rgba(255, 149, 0, 0.4);
    }
    .mv-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .mv-btn {
      background: linear-gradient(180deg, #2b333c 0%, #1f252b 100%);
      border: 1px solid #3d4955;
      color: #cbd5e1;
      font-size: 12.5px;
      font-weight: 700;
      padding: 7px 12px;
      border-radius: 3px;
      cursor: pointer;
      transition: all 0.12s ease;
      box-shadow: 0 1px 2px rgba(0,0,0,0.4);
    }
    .mv-btn:hover {
      background: linear-gradient(180deg, #37424d 0%, #29313a 100%);
      border-color: #556475;
      color: #fff;
    }
    .mv-btn.active {
      background: linear-gradient(180deg, #008744 0%, #005c2e 100%);
      border-color: #00e676;
      color: #fff;
      box-shadow: 0 0 8px rgba(0, 230, 118, 0.35);
    }
    .clock-display {
      font-family: var(--font-mono);
      font-size: 15px;
      font-weight: 700;
      color: #fff;
      background: #14191f;
      padding: 5px 10px;
      border-radius: 3px;
      border: 1px solid #28323d;
      display: flex;
      align-items: center;
      gap: 6px;
      flex: none;
    }
    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #ff3b30;
      box-shadow: 0 0 6px #ff3b30;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.85); }
    }

    /* Container MultiView com Layout Responsivo */
    #multiview-stage {
      /* controle.css limita main a 1280px; o multiview usa a janela inteira. */
      max-width: none;
      margin: 0;
      width: 100%;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 10px;
      box-sizing: border-box;
      min-height: 0;
      background: #090c0e;
      overflow-y: auto;
    }

    /* Área Master: Preview e Program */
    .master-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      flex: 1.3;
      min-height: 0;
    }
    .master-row.vertical-masters {
      flex: 1.6;
    }

    /* Monitor Individual */
    .mv-box {
      background: var(--card-bg);
      border: 2px solid var(--border-color);
      border-radius: 4px;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      box-shadow: 0 3px 10px rgba(0,0,0,0.5);
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .mv-box.is-pv {
      border-color: var(--pv-color);
      box-shadow: 0 0 12px rgba(0, 230, 118, 0.4);
    }
    .mv-box.is-pgm {
      border-color: var(--pgm-color);
      box-shadow: 0 0 14px rgba(255, 59, 48, 0.45);
    }
    .mv-box.is-stalled {
      border-color: #ff9500;
    }
    .mv-box.is-offline {
      border-color: #7f1d1d;
      opacity: 0.85;
    }

    .mv-screen {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: repeating-conic-gradient(#14181f 0% 25%, #0c1014 0% 50%) 50%/20px 20px;
      overflow: hidden;
    }

    .screen-preview-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      text-align: center;
      width: 100%;
      height: 100%;
    }
    .screen-title {
      font-size: 22px;
      font-weight: 800;
      color: #e2e8f0;
      letter-spacing: 0.5px;
    }
    .screen-sub {
      font-size: 11.5px;
      font-weight: 700;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .mv-overlay-tag {
      position: absolute;
      top: 8px;
      left: 8px;
      font-size: 11.5px;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 3px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      z-index: 10;
    }
    .tag-pv {
      background: var(--pv-color);
      color: #000;
    }
    .tag-pgm {
      background: var(--pgm-color);
      color: #fff;
    }
    .tag-std {
      background: #242c35;
      color: #94a3b8;
    }

    .health-alert-badge {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(255, 149, 0, 0.9);
      color: #000;
      font-size: 10.5px;
      font-weight: 900;
      padding: 3px 7px;
      border-radius: 3px;
      z-index: 10;
      box-shadow: 0 1px 4px rgba(0,0,0,0.6);
    }
    .health-alert-badge.alert-red {
      background: rgba(220, 38, 38, 0.95);
      color: #fff;
    }

    .mv-info-bar {
      height: 32px;
      background: #12161b;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
      border-top: 1px solid #232b34;
      font-size: 12.5px;
      font-weight: 700;
      color: #cbd5e1;
      flex: none;
    }
    .mv-name {
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .mv-num {
      width: auto;
      min-width: 22px;
      padding: 0 5px;
      height: 22px;
      background: #232a32;
      border-radius: 3px;
      display: grid;
      place-items: center;
      font-size: 11.5px;
      color: #8c9ba8;
      font-weight: 800;
    }
    .is-pv .mv-num {
      background: var(--pv-color);
      color: #000;
    }
    .is-pgm .mv-num {
      background: var(--pgm-color);
      color: #fff;
    }

    /* VUMeter Estéreo */
    .mv-vumeter {
      width: 28px;
      height: 9px;
      background: #090d10;
      border-radius: 2px;
      border: 1px solid #20272f;
      display: flex;
      flex-direction: column;
      gap: 1px;
      padding: 1px;
      overflow: hidden;
    }
    .vu-bar {
      height: 3px;
      background: linear-gradient(90deg, #00e676 0%, #ff9500 70%, #ff3b30 100%);
      width: 10%;
      border-radius: 1px;
      transition: width 0.08s ease-out;
    }

    /* Grades de Entradas */
    .inputs-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      flex: 1;
      min-height: 0;
    }
    .inputs-grid.grid-12 {
      grid-template-columns: repeat(6, 1fr);
    }
    .quad-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 10px;
      flex: 1;
      min-height: 0;
    }

    /* =========================================================================
       SAFE ZONES OVERLAY
       ========================================================================= */
    .safe-zone-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 5;
    }
    .standard-broadcast-safe .action-safe-box {
      position: absolute;
      top: 5%;
      left: 5%;
      width: 90%;
      height: 90%;
      border: 1px dashed rgba(255, 255, 255, 0.2);
      box-sizing: border-box;
    }
    .standard-broadcast-safe .title-safe-box {
      position: absolute;
      top: 5.5%;
      left: 5.5%;
      width: 89%;
      height: 89%;
      border: 1px solid rgba(0, 163, 255, 0.35);
      box-sizing: border-box;
    }
    .safe-tag {
      position: absolute;
      bottom: 4px;
      right: 4px;
      font-size: 9.5px;
      font-weight: 800;
      color: rgba(0, 163, 255, 0.7);
      letter-spacing: 0.5px;
    }

    /* Safe Zone Vertical 9:16 Social (TikTok / Reels / Shorts) */
    .vertical-social-safe .social-safe-box {
      position: absolute;
      top: 12%;
      left: 6%;
      right: 18%;
      bottom: 22%;
      border: 1px dashed rgba(255, 59, 48, 0.45);
      box-sizing: border-box;
      background: rgba(255, 59, 48, 0.02);
    }
    .social-side-hud {
      position: absolute;
      top: 25%;
      right: -24px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      opacity: 0.35;
      font-size: 12px;
    }
    .social-bottom-hud {
      position: absolute;
      bottom: -18px;
      left: 0;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 3px;
      opacity: 0.3;
    }
    .hud-bar-sm {
      width: 45%;
      height: 4px;
      background: #fff;
      border-radius: 2px;
    }
    .hud-bar-lg {
      width: 75%;
      height: 3px;
      background: #888;
      border-radius: 2px;
    }

    /* =========================================================================
       LAYOUTS ESPECÍFICOS: VERTICAL 9:16 E SOCIAL
       ========================================================================= */
    body.layout-vertical_9_16_mobile #multiview-stage,
    body.layout-vertical_9_16_social_feed #multiview-stage {
      padding: 6px;
      gap: 6px;
    }
    body.layout-vertical_9_16_mobile .master-row {
      grid-template-columns: 1fr 1fr;
    }
    body.layout-vertical_9_16_mobile .inputs-grid {
      grid-template-columns: repeat(4, 1fr);
    }
    body.layout-vertical_9_16_social_feed .master-row {
      grid-template-columns: 1.4fr 1fr;
    }
    body.layout-vertical_9_16_social_feed .inputs-grid {
      grid-template-columns: repeat(2, 1fr);
    }
  </style>
</head>
<body class="layout-horizontal_16_9_standard" data-tipografia="3mix">
  <header>
    <div class="mv-brand">
      <span class="mv-badge">3MIX PRO</span>
      <span>MultiView Broadcast</span>
      <span id="ws-status" class="status-badge">CONECTANDO…</span>
    </div>

    <div class="mv-controls">
      <button class="mv-btn active" data-layout="horizontal_16_9_standard" title="Horizontal 16:9 Tradicional (2 Master + 8 Câmeras)">16:9 Standard</button>
      <button class="mv-btn" data-layout="horizontal_16_9_studio12" title="Horizontal 16:9 Estúdio 12 Fontes">Studio 12</button>
      <button class="mv-btn" data-layout="vertical_9_16_mobile" title="Vertical 9:16 Mobile Nativo (TikTok / Reels / Shorts)">Vertical 9:16</button>
      <button class="mv-btn" data-layout="vertical_9_16_social_feed" title="Vertical Feed Social Proeminente">Social Feed</button>
      <button class="mv-btn" data-layout="quad_split" title="Quad Split 4 Telas Simétricas">Quad Split</button>
      <button class="mv-btn active" id="btn-safe" title="Alternar Guias de Safe Area Broadcast / Redes Sociais">Safe Areas</button>
      <button class="mv-btn" id="btn-full" title="Alternar Tela Cheia">⛶ Tela Cheia</button>
    </div>

    <div class="clock-display">
      <span class="live-dot"></span>
      <span id="mv-clock">00:00:00</span>
      <span style="color:#64748b;font-size:11.5px;font-weight:700;">LIVE</span>
    </div>
  </header>

  <main id="multiview-stage">
    <!-- Renderizado dinamicamente por multiview.js -->
  </main>

  <script src="multiview.js"></script>
</body>
</html>
