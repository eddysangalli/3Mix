<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>3Mix · Multiview</title>
  <script src="3mix-padrao.js"></script>
  <link rel="stylesheet" href="3mix-grafite.css">
  <link rel="stylesheet" href="3mix-padrao.css">
  <style>
    html, body.p3 { height: 100%; overflow: hidden; user-select: none; }
    body.cheia .p3-head, body.cheia #mv-offline { display: none; }
    .p3 .p3-head select { width: auto; max-width: 240px; height: 32px; padding: 2px 8px; font-size: 13px; }
    .p3 .p3-head button { height: 32px; }
    #mv-offline { flex: none; padding: 6px 12px; background: #302511; border-bottom: 1px solid #6b5320; color: #f0d9a5; font-size: 13px; }

    /* O palco desenha o monitor inteiro com a proporção dele; cada posição vem da montagem. */
    #multiview-stage { flex: 1 1 auto; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 8px; background: #111; overflow: hidden; }
    body.cheia #multiview-stage { padding: 0; background: #000; }
    .mv-canvas { position: relative; flex: none; background: #000; }
    .mv-box { position: absolute; background: #0d0d0d; border: 2px solid #3a3a3a; overflow: hidden; }
    .mv-box.is-pv { border-color: #2fa04d; }
    .mv-box.is-pgm { border-color: #d8392b; }
    .mv-box.is-stalled { border-color: var(--p3-warn); }
    .mv-box.is-offline { border-color: #7f1d1d; }
    .mv-box img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
    .mv-box.caber img { object-fit: contain; }
    .mv-nosignal { position: absolute; inset: 0; display: grid; place-items: center; color: #666; font-size: 14px; font-weight: 700; text-align: center; padding: 4px; }
    .mv-box.has-image .mv-nosignal { display: none; }
    .mv-box.is-empty { background: #161616; border-style: dashed; border-color: #2f2f2f; }

    .mv-label { position: absolute; left: 0; right: 0; bottom: 0; z-index: 3; display: flex; align-items: center; gap: 6px; min-height: 22px; padding: 3px 7px; background: rgba(0,0,0,.72); color: #fff; font-size: clamp(11px, 1vw, 14px); font-weight: 700; }
    .mv-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .mv-tag { flex: none; padding: 1px 6px; border-radius: 2px; font-size: .82em; font-weight: 800; letter-spacing: .3px; color: #fff; }
    .mv-box.is-pgm .mv-tag { background: #d8392b; }
    .mv-box.is-pv .mv-tag { background: #2fa04d; }
    .mv-vu { flex: none; width: 34px; display: flex; flex-direction: column; gap: 1px; }
    .mv-vu i { display: block; height: 3px; width: 100%; background: #333; position: relative; overflow: hidden; }
    .mv-vu i::after { content: ""; position: absolute; inset: 0; width: var(--level, 0%); background: linear-gradient(90deg, #2fa04d 0%, #dca900 75%, #d8392b 100%); }
    .mv-alert { position: absolute; top: 4px; right: 4px; z-index: 3; padding: 2px 6px; border-radius: 2px; background: var(--p3-warn); color: #000; font-size: 11px; font-weight: 800; }

    .mv-clock { position: absolute; inset: 0; container-type: size; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0d0d0d; color: #fff; }
    .mv-clock b { font-size: min(62cqh, 17cqw); font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; letter-spacing: .5px; }
    .mv-clock small { font-size: min(16cqh, 5cqw); font-weight: 700; color: var(--p3-dim); text-transform: uppercase; letter-spacing: .6px; }
    .mv-clock.ativo b { color: #ff5a4d; }

    .mv-safe { position: absolute; z-index: 2; pointer-events: none; }
    .mv-safe.action { inset: 5%; border: 1px dashed rgba(255,255,255,.28); }
    .mv-safe.title { inset: 10%; border: 1px solid rgba(91,139,243,.5); }
    .mv-safe.social { top: 12%; left: 6%; right: 18%; bottom: 22%; border: 1px dashed rgba(255,255,255,.35); }
  </style>
</head>
<body class="p3" data-page="multiview">
  <header class="p3-head">
    <a href="/" title="3Mix"><img class="p3-logo" src="/img/3mix-logo.png" alt="3Mix"></a>
    <select id="mv-montagem" aria-label="Montagem"></select>
    <span class="p3-flex"></span>
    <span id="connection" data-state="wait">Conectando…</span>
    <button type="button" id="btn-editar">Editar montagem</button>
    <button type="button" id="btn-full">Tela cheia</button>
  </header>
  <div id="mv-offline" role="status" hidden></div>
  <main id="multiview-stage"><div class="mv-canvas" id="mv-canvas"></div></main>

  <script src="multiview-modelos.js?v=20261102a"></script>
  <script src="multiview.js?v=20261102a"></script>
</body>
</html>
