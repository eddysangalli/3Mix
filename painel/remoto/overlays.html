<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>3Mix · DSK</title>
  <script src="3mix-padrao.js"></script>
  <link rel="stylesheet" href="3mix-grafite.css">
  <link rel="stylesheet" href="3mix-padrao.css">
  <style>
    .dsk { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 16px; align-items: start; }
    .dsk-channels { padding: 12px; gap: 10px; position: sticky; top: 0; }
    .dsk-channels > button { width: 100%; }
    #channel-tabs { display: flex; flex-direction: column; gap: 4px; }
    .p3 #channel-tabs button {
      height: 46px; width: 100%; padding: 0 10px; justify-content: flex-start; gap: 10px; text-align: left;
      background: var(--p3-field); border-color: var(--p3-line-soft);
    }
    .p3 #channel-tabs button.selected { background: #2f3436; border-color: var(--p3-accent); box-shadow: inset 3px 0 var(--p3-accent); }
    .dsk-num { flex: none; width: 26px; height: 26px; display: grid; place-items: center; border-radius: 3px; background: #333; color: #ddd; font-size: 13px; font-weight: 800; }
    .dsk-who { min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--p3-dim); font-weight: 600; }
    .p3 #channel-tabs button.on-air .dsk-num { background: var(--p3-pgm); color: #fff; }
    .p3 #channel-tabs button.on-air .dsk-who { color: #fff; }

    .dsk-source { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 10px; align-items: end; }
    .p3 .dsk-source button { height: 42px; min-width: 128px; font-size: 14px; }
    .p3 .dsk-source select { height: 42px; font-size: 15px; }

    .dsk-transition { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px 20px; }

    .dsk-pos { display: grid; grid-template-columns: 208px minmax(0, 1fr); gap: 16px; align-items: start; }
    .dsk-frame { position: relative; width: 208px; aspect-ratio: 16 / 9; background: var(--p3-sunken); border: 1px solid var(--p3-line); border-radius: 3px; overflow: hidden; }
    .dsk-frame i { position: absolute; background: var(--p3-accent-soft); border: 1px solid var(--p3-accent-strong); }
    .dve-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 6px; }
    .p3 .dve-grid button { height: 36px; padding: 0 8px; font-size: 12.5px; background: var(--p3-field); }
    .p3 .dve-grid button.active { background: #2f3436; border-color: var(--p3-accent); color: #fff; box-shadow: inset 0 -2px var(--p3-accent); }
    .dsk-xywh { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
    #dve-status { color: var(--p3-dim); font-size: 12.5px; }
    #dve-status:empty { display: none; }

    .dsk-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

    @media (max-width: 960px) {
      .dsk { grid-template-columns: 1fr; }
      .dsk-channels { position: static; }
      #channel-tabs { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
      .dsk-pos { grid-template-columns: 1fr; }
      .dsk-source { grid-template-columns: 1fr 1fr; }
      .dsk-source > .p3-field { grid-column: 1 / -1; }
      .dsk-xywh { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
  </style>
</head>
<body data-page="overlays" class="p3">
  <header class="p3-head">
    <a href="/" title="3Mix"><img class="p3-logo" src="/img/3mix-logo.png" alt="3Mix"></a>
    <h1>DSK</h1>
    <span class="p3-flex"></span>
    <span id="connection">Conectando…</span>
  </header>

  <main class="p3-main">
    <div id="message" role="status" aria-live="polite"></div>

    <div class="dsk">
      <aside class="p3-card dsk-channels" aria-label="Canais de DSK">
        <div id="channel-tabs" role="tablist">
          <button type="button" role="tab" data-channel="1" class="selected"><span class="dsk-num">1</span><span class="dsk-who">Livre</span></button>
          <button type="button" role="tab" data-channel="2"><span class="dsk-num">2</span><span class="dsk-who">Livre</span></button>
          <button type="button" role="tab" data-channel="3"><span class="dsk-num">3</span><span class="dsk-who">Livre</span></button>
          <button type="button" role="tab" data-channel="4"><span class="dsk-num">4</span><span class="dsk-who">Livre</span></button>
          <button type="button" role="tab" data-channel="5"><span class="dsk-num">5</span><span class="dsk-who">Livre</span></button>
          <button type="button" role="tab" data-channel="6"><span class="dsk-num">6</span><span class="dsk-who">Livre</span></button>
          <button type="button" role="tab" data-channel="7"><span class="dsk-num">7</span><span class="dsk-who">Livre</span></button>
          <button type="button" role="tab" data-channel="8"><span class="dsk-num">8</span><span class="dsk-who">Livre</span></button>
        </div>
        <button type="button" id="btn-kill-all" class="danger" title="Tira do ar todos os canais de DSK">Tirar todos do ar</button>
      </aside>

      <section id="channel-editor" class="p3-card">
        <div class="p3-card-head">
          <h2 id="channel-heading">DSK 1</h2>
          <div id="channel-status-badge"><span class="p3-badge">Fora do ar</span></div>
        </div>

        <div class="dsk-source">
          <label class="p3-field">Entrada
            <select id="channel-input"><option value="">Escolha a entrada…</option></select>
          </label>
          <button type="button" id="btn-channel-take" class="air">Colocar no ar</button>
          <button type="button" id="btn-channel-off">Tirar do ar</button>
        </div>

        <div class="dsk-transition">
          <label class="p3-field">Transição
            <select id="channel-transition"></select>
          </label>
          <label class="p3-field">Duração: <b id="val-duration">500 ms</b>
            <input type="range" id="channel-duration" min="50" max="5000" step="50" value="500">
          </label>
        </div>

        <div class="p3-field">Posição</div>
        <div class="dsk-pos">
          <div class="dsk-frame" aria-hidden="true"><i id="dve-frame"></i></div>
          <div class="dve-grid">
            <button type="button" data-dve="fullscreen" class="active">Tela cheia</button>
            <button type="button" data-dve="lower-third">Tarja</button>
            <button type="button" data-dve="pip-top-right">PIP ↗</button>
            <button type="button" data-dve="pip-top-left">PIP ↖</button>
            <button type="button" data-dve="pip-bottom-right">PIP ↘</button>
            <button type="button" data-dve="pip-bottom-left">PIP ↙</button>
            <button type="button" data-dve="split-left">Metade esq.</button>
            <button type="button" data-dve="split-right">Metade dir.</button>
          </div>
        </div>
        <p id="dve-status" role="status"></p>

        <details>
          <summary>Mais opções</summary>
          <div class="p3-card" style="padding:0;border:0;background:none">
            <div class="p3-grid">
              <label class="p3-field">Sair do ar sozinho
                <select id="channel-hide-after">
                  <option value="0" selected>Não, só manual</option>
                  <option value="3">Em 3 s</option>
                  <option value="5">Em 5 s</option>
                  <option value="8">Em 8 s</option>
                  <option value="10">Em 10 s</option>
                  <option value="15">Em 15 s</option>
                  <option value="30">Em 30 s</option>
                </select>
              </label>
              <label class="p3-field">Usar a transição
                <select id="channel-trans-type">
                  <option value="match" selected>Ao entrar e ao sair</option>
                  <option value="show">Só ao entrar</option>
                  <option value="hide">Só ao sair</option>
                </select>
              </label>
              <label class="p3-check" style="align-self:end;height:38px" title="Entra e sai junto com o corte do Programa">
                <input type="checkbox" id="channel-tie"> Acompanhar o corte (TIE)
              </label>
            </div>

            <div class="p3-grid" id="stinger-box" hidden>
              <label class="p3-field">Ponto de corte do stinger: <b id="val-cutpoint">250 ms</b>
                <input type="range" id="stinger-cutpoint" min="0" max="3000" step="25" value="250">
              </label>
              <label class="p3-check" style="align-self:end;height:38px">
                <input type="checkbox" id="stinger-audio" checked> Som do stinger só no retorno
              </label>
            </div>

            <div class="dsk-xywh">
              <label class="p3-field">X<input type="number" id="dve-x" value="0"></label>
              <label class="p3-field">Y<input type="number" id="dve-y" value="0"></label>
              <label class="p3-field">Largura<input type="number" id="dve-w" value="1920"></label>
              <label class="p3-field">Altura<input type="number" id="dve-h" value="1080"></label>
              <label class="p3-field">Opacidade<input type="number" id="dve-opacity" min="0" max="1" step="0.05" value="1"></label>
            </div>
            <div class="p3-row">
              <button type="button" id="btn-dve-restore" class="quiet" title="Devolve a entrada à posição original">Restaurar posição original</button>
            </div>
          </div>
        </details>

        <div class="dsk-actions">
          <button type="button" id="btn-channel-apply" class="primary">Salvar canal</button>
        </div>
      </section>
    </div>
  </main>

  <script src="controle.js"></script>
  <script src="overlays.js?v=20261101p"></script>
</body>
</html>
