<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>3Mix · Atalhos</title>
<script src="3mix-padrao.js"></script>
<link rel="stylesheet" href="3mix-grafite.css">
<link rel="stylesheet" href="3mix-padrao.css">
<style>
  .sc-key { display: inline-flex; align-items: center; min-height: 26px; padding: 2px 9px; background: #171717; border: 1px solid #555; border-bottom-width: 2px; border-radius: 4px; color: #fff; font-weight: 700; font-size: 13px; white-space: nowrap; }
  .sc-off { opacity: .5; }
  .sc-learn { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: end; }
  .p3 #learn-key, .p3 #learn-midi { height: 38px; min-width: 170px; }
  .p3 #learn-key.listening, .p3 #learn-midi.listening { background: var(--p3-accent); border-color: var(--p3-accent); color: #fff; }
  #learned { display: none; }
  .sc-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .sc-status-err { color: #ffb4a8; }
  #items td:last-child:not([colspan]) { white-space: nowrap; text-align: right; }
  .sc-ctrl { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px 16px; }
</style>
</head>
<body data-page="atalhos" class="p3">
<header class="p3-head">
  <a href="/" title="3Mix"><img class="p3-logo" src="/img/3mix-logo.png" alt="3Mix"></a>
  <h1>Atalhos</h1>
  <span class="p3-flex"></span>
  <span id="connection">Conectando…</span>
</header>

<main class="p3-main">
  <div class="p3-tabs" role="tablist">
    <button type="button" role="tab" data-tab="atalhos" class="selected">Atalhos</button>
    <button type="button" role="tab" data-tab="controladores">MIDI e OSC</button>
  </div>

  <!-- ==================== atalhos ==================== -->
  <div data-pane="atalhos" style="display:flex;flex-direction:column;gap:16px">
    <section class="p3-card">
      <div class="p3-card-head">
        <h2>Atalhos desta produção</h2>
        <div class="sc-actions">
          <span id="transfer-msg" style="font-size:12px;color:#9bc3a1"></span>
          <button type="button" id="import-shortcuts">Importar JSON</button>
          <button type="button" id="export-shortcuts">Exportar JSON</button>
          <button type="button" id="new" class="primary">Novo atalho</button>
          <input id="import-shortcuts-file" type="file" accept="application/json,.json" hidden>
        </div>
      </div>
      <div class="p3-table-wrap">
        <table>
          <thead><tr><th>Tecla</th><th>O que faz</th><th>Estado</th><th></th></tr></thead>
          <tbody id="items"></tbody>
        </table>
      </div>
    </section>

    <section class="p3-card" id="editor" hidden>
      <div class="p3-card-head"><h2 id="editor-title">Novo atalho</h2></div>

      <div class="p3-grid">
        <label class="p3-field">Quando apertar
          <select id="type">
            <option value="keyboard">Tecla do teclado</option>
            <option value="midi">Controle MIDI</option>
          </select>
        </label>
        <div id="keyboard" class="sc-learn">
          <label class="p3-field">Tecla
            <input id="key" readonly placeholder="Nenhuma">
          </label>
          <button type="button" id="learn-key">Aprender tecla</button>
        </div>
        <div id="midi" class="sc-learn" hidden>
          <label class="p3-field">Controle
            <input id="midi-learned" readonly placeholder="Nenhum">
          </label>
          <button type="button" id="learn-midi">Aprender controle</button>
        </div>
      </div>

      <div class="p3-grid">
        <label class="p3-field">Fazer o quê
          <select id="action">
            <optgroup label="Corte">
              <option value="preview">Mandar para o Preview</option>
              <option value="cut">Cortar para o Programa</option>
              <option value="fade">Fade para o Programa</option>
              <option value="active">Colocar direto no Programa</option>
            </optgroup>
            <optgroup label="Gráficos">
              <option value="overlay">Ligar DSK</option>
            </optgroup>
            <optgroup label="Áudio">
              <option value="audio_mute">Mudo da entrada</option>
              <option value="audio_volume">Volume da entrada</option>
              <option value="audio_bus">Enviar a um barramento</option>
              <option value="talkback">Talkback (segurar)</option>
            </optgroup>
            <optgroup label="Mídia e automação">
              <option value="media">Controlar VT</option>
              <option value="macro_run">Executar macro</option>
            </optgroup>
          </select>
        </label>

        <label id="input-field" class="p3-field">Entrada
          <select id="input"></select>
        </label>
        <label id="macro-field" class="p3-field" hidden>Macro
          <select id="macro"></select>
        </label>
        <label id="value-field" class="p3-field"><span id="value-label">Valor</span>
          <input id="value" type="number" value="500">
        </label>
        <label id="bus-field" class="p3-field" hidden>Barramento
          <select id="bus"><option>M</option><option>A</option><option>B</option></select>
        </label>
        <label id="toggle-field" class="p3-field" hidden>Estado
          <select id="toggle"><option value="true">Ligado</option><option value="false">Desligado</option></select>
        </label>
        <label id="command-field" class="p3-field" hidden>Comando
          <select id="command">
            <option value="PLAY">Play</option>
            <option value="PAUSE">Pausar</option>
            <option value="STOP">Parar</option>
            <option value="RESTART">Reiniciar</option>
            <option value="NEXT">Próximo</option>
            <option value="PREVIOUS">Anterior</option>
          </select>
        </label>
      </div>

      <div class="p3-grid">
        <label class="p3-field">Nome (opcional)
          <input id="name" maxlength="80" placeholder="Automático" spellcheck="false">
        </label>
      </div>

      <div class="p3-row">
        <label class="p3-check"><input id="enabled" type="checkbox" checked> Ativado</label>
        <label class="p3-check" id="global-label"><input id="global" type="checkbox"> Funciona fora do 3Mix</label>
        <label class="p3-check" id="continuous-label" hidden><input id="continuous" type="checkbox"> Fader contínuo</label>
        <span id="global-status" class="p3-note"></span>
        <span id="learned" aria-hidden="true"></span>
      </div>

      <div class="sc-actions">
        <button type="button" id="save" class="primary">Salvar atalho</button>
        <button type="button" id="cancel-edit">Cancelar</button>
        <span id="status" role="status"></span>
      </div>
    </section>
  </div>

  <!-- ==================== controladores ==================== -->
  <div data-pane="controladores" style="display:none;flex-direction:column;gap:16px">
    <section class="p3-card">
      <div class="p3-card-head">
        <h2>MIDI</h2>
        <button type="button" id="connect-midi">Conectar MIDI</button>
      </div>
      <p id="devices" class="p3-note" style="white-space:pre-line"></p>

      <label class="p3-check"><input id="feedback-midi" type="checkbox"> Acender LED ou mover fader do controlador</label>
      <div id="feedback-fields" hidden>
        <div class="sc-ctrl">
          <label class="p3-field">Porta<select id="midi-output"></select></label>
          <label class="p3-field">Tipo<select id="midi-feedback-message"><option value="note">Nota / LED</option><option value="cc">CC / Fader</option></select></label>
          <label class="p3-field">Canal<input id="midi-feedback-channel" type="number" min="1" max="16" value="1"></label>
          <label class="p3-field">Número<input id="midi-feedback-number" type="number" min="0" max="127" value="0"></label>
          <label class="p3-field">Valor<select id="midi-feedback-value"><option value="active">Ativo / inativo</option><option value="volume">Volume</option></select></label>
          <label class="p3-field">Ligado<input id="midi-feedback-on" type="number" min="0" max="127" value="127"></label>
          <label class="p3-field">Desligado<input id="midi-feedback-off" type="number" min="0" max="127" value="0"></label>
        </div>
      </div>
      <button type="button" id="connect-midi-feedback" hidden></button>
    </section>

    <section class="p3-card">
      <div class="p3-card-head">
        <h2>OSC</h2>
        <span id="osc-state" class="p3-badge">Parado</span>
      </div>
      <div class="p3-inline">
        <label class="p3-field" style="flex:0 0 150px">Porta UDP<input id="osc-port" type="number" min="1024" max="65535" value="19120"></label>
        <button type="button" id="osc-configure">Salvar porta</button>
        <button type="button" id="osc-start" class="primary">Iniciar</button>
        <button type="button" id="osc-stop">Parar</button>
        <button type="button" id="http-recipe" class="quiet">Comandos HTTP</button>
      </div>
      <pre id="http-recipe-output" class="p3-log"></pre>
      <pre id="osc-status" hidden></pre>
    </section>
  </div>
</main>

<script src="controle.js"></script>
<script src="fechar-janela.js"></script>
<script src="midi-feedback.js"></script>
<script src="atalhos-engine.js"></script>
<script src="atalhos.js?v=20261101p"></script>
</body>
</html>
