<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>3Mix · Mesa de corte</title>
<script src="3mix-padrao.js"></script>
<link rel="stylesheet" href="controle.css?v=20261102a">
<link rel="stylesheet" href="3mix-grafite.css">
<link rel="stylesheet" href="3mix-padrao.css">
<style>
  /* controle.css continua aqui só pelo diálogo de pareamento e pelos botões de entrada. */
  body.p3 { background-image: none; touch-action: manipulation; }
  .p3 main.p3-main { width: 100%; max-width: 1560px; margin: 0 auto; gap: 12px; }
  .p3 header.p3-head { padding: 0 16px; }
  #message:empty { display: none; }
  #message { padding: 8px 12px; background: var(--p3-panel); border: 1px solid var(--p3-line); border-radius: 4px; font-size: 13px; }

  .monitores { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .p3 section.mon { padding: 0; margin: 0; }
  .mon { display: flex; flex-direction: column; border: 2px solid #3a3a3a; border-radius: 4px; overflow: hidden; background: #000; }
  .mon.pv { border-color: #1f9d55; }
  .mon.pgm { border-color: #d8392b; }
  .mon-head { display: flex; align-items: center; gap: 10px; height: 30px; padding: 0 10px; background: #1d1d1d; font-size: 12px; font-weight: 800; letter-spacing: .4px; }
  .mon.pv .mon-tag { color: #4ade80; }
  .mon.pgm .mon-tag { color: #ff6a5e; }
  .mon-nome { color: #fff; font-size: 13px; letter-spacing: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mon-tela { position: relative; aspect-ratio: var(--formato, 16 / 9); background: #000; }
  .mon-tela img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; display: block; }
  .mon-tela img[hidden] { display: none; }
  .mon-vazio { position: absolute; inset: 0; display: grid; place-items: center; color: #777; font-size: 13px; }
  .mon-tela.com-imagem .mon-vazio { display: none; }

  .controles { display: grid; grid-template-columns: 150px 150px 100px minmax(200px, 1fr) auto auto; align-items: end; gap: 10px; padding: 12px; background: var(--p3-panel); border: 1px solid var(--p3-line); border-radius: 4px; }
  .p3 .controles button, .p3 .controles .acao { height: 52px; border-radius: 4px; font-size: 15px; font-weight: 800; letter-spacing: .5px; }
  .p3 .controles .cut-btn { background: #b02a1f; border: 1px solid #d8392b; color: #fff; }
  .p3 .controles .cut-btn:hover { background: #c5352a; }
  .p3 .controles .fade-btn { background: #333; border: 1px solid #555; color: #fff; }
  .p3 .controles .fade-btn:hover { background: #3d3d3d; }
  .p3 .controles .secundario { padding: 0 16px; font-size: 13px; font-weight: 700; letter-spacing: 0; background: #2a2a2a; border: 1px solid var(--p3-line); color: #ddd; }
  .p3 .controles .secundario.armado { background: #b02a1f; border-color: #d8392b; color: #fff; }
  .p3 .controles a.secundario { display: inline-flex; align-items: center; text-decoration: none; }
  .controles label { display: flex; flex-direction: column; gap: 6px; color: #ddd; font-size: 12.5px; font-weight: 600; min-width: 0; }
  .p3 .controles input[type=number] { height: 52px; width: 100%; font-size: 15px; }
  .tbar-topo { display: flex; justify-content: space-between; width: 100%; }
  .controles label.tbar { align-items: stretch; }
  .p3 .controles input[type=range] { width: 100%; height: 52px; margin: 0; cursor: pointer; accent-color: var(--p3-accent); }

  .entradas { display: flex; flex-direction: column; gap: 8px; }
  .entradas h2 { font-size: 11.5px; font-weight: 800; letter-spacing: .6px; text-transform: uppercase; color: #8d8d8d; border: 0; padding: 0; margin: 0; }
  #inputs { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  .p3 #inputs button { position: relative; aspect-ratio: 16 / 9; min-height: 0; height: auto; padding: 0; overflow: hidden; display: flex; align-items: flex-end; background: #161616 center / cover no-repeat; background-image: var(--thumb, none) !important; border: 2px solid #3a3a3a; border-radius: 4px; color: #fff; font-size: 12.5px; font-weight: 700; text-align: left; box-shadow: none; }
  .p3 #inputs button span { display: block; width: 100%; padding: 3px 7px; background: rgba(0, 0, 0, .72); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .p3 #inputs button:hover { border-color: #777; }
  .p3 #inputs button.preview { border-color: #1f9d55; background-color: #161616; }
  .p3 #inputs button.preview span { background: #17693b; }
  .p3 #inputs button.program { border-color: #d8392b; background-color: #161616; }
  .p3 #inputs button.program span { background: #b02a1f; }

  @media (max-width: 900px), (orientation: portrait) {
    .monitores { grid-template-columns: 1fr; }
    .controles { grid-template-columns: 1fr 1fr; }
    .controles .tbar { grid-column: 1 / -1; }
    #inputs { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); }
  }
</style>
</head>
<body data-page="corte" class="p3">
<header class="p3-head">
  <a href="/" title="3Mix" class="brand-logo"><img class="p3-logo" src="/img/3mix-logo.png" alt="3Mix"></a>
  <h1>Mesa de corte</h1>
  <span class="p3-flex"></span>
  <span id="connection" class="p3-badge">Conectando…</span>
</header>

<main class="p3-main">
  <div id="message" role="status" aria-live="polite"></div>

  <div class="monitores">
    <section class="mon pv">
      <div class="mon-head"><span class="mon-tag">PREVIEW</span><span class="mon-nome" id="preview">—</span></div>
      <div class="mon-tela" data-monitor="preview"><img alt="Imagem do Preview" hidden><span class="mon-vazio">Sem imagem</span></div>
    </section>
    <section class="mon pgm">
      <div class="mon-head"><span class="mon-tag">PROGRAMA</span><span class="mon-nome" id="program">—</span></div>
      <div class="mon-tela" data-monitor="program"><img alt="Imagem do Programa" hidden><span class="mon-vazio">Sem imagem</span></div>
    </section>
  </div>

  <section class="controles">
    <button class="cut-btn" data-action="cut">CUT</button>
    <button class="fade-btn" data-action="fade">AUTO</button>
    <label>Duração (ms)<input id="duration" type="number" min="50" max="20000" value="500"></label>
    <label class="tbar"><span class="tbar-topo"><span>T-Bar</span><span id="tbar-val">0%</span></span><input id="tbar" type="range" min="0" max="100" value="0"></label>
    <button id="btn-dump" type="button" class="secundario" title="Descarta o trecho do delay no ar. Clique duas vezes para confirmar.">DUMP</button>
    <a class="acao secundario" href="/preflight" target="_blank" rel="noopener">Pre-Flight</a>
  </section>

  <section class="entradas">
    <h2>Entradas</h2>
    <div id="inputs"></div>
  </section>
</main>

<script src="controle.js?v=20261102a"></script>
<script src="corte.js?v=20261102a"></script>
</body>
</html>
