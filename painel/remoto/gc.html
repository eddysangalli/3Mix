<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>3Mix · GC e placar</title>
  <link rel="stylesheet" href="controle.css?v=20261031j">
  <link rel="stylesheet" href="studio-dialog.css">
  <link rel="stylesheet" href="operacao.css">
  <script src="3mix-padrao.js"></script>
  <link rel="stylesheet" href="3mix-grafite.css">
  <link rel="stylesheet" href="3mix-padrao.css">
  <style>
    /* controle.css, studio-dialog.css e operacao.css continuam aqui pelos diálogos. */
    body.p3 { background-image: none; }
    .p3 main.p3-main { max-width: none; gap: 12px; }
    .p3 header.p3-head { padding: 0 16px; }
    #message:empty, #status:empty { display: none; }
    .gc-barra { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .p3 .gc-barra a.link-sync { color: var(--p3-muted); font-size: 13px; }
    .file-input-wrapper { display: inline-flex; align-items: center; height: 34px; padding: 0 12px; background: #2a2a2a; border: 1px solid var(--p3-line); border-radius: 4px; font-size: 13px; font-weight: 600; cursor: pointer; }
    .file-input-wrapper:hover { background: #333; }
    .file-input-wrapper input { display: none; }
    #saved { display: flex; flex-wrap: wrap; gap: 6px; }
    #saved:empty { display: none; }
    .p3 #saved button { height: 30px; padding: 0 10px; font-size: 12.5px; }
    .p3 #saved button.air { background: #b02a1f; border-color: #d8392b; color: #fff; }
    .workbench { display: grid; grid-template-columns: minmax(340px, 470px) minmax(0, 1fr); gap: 14px; align-items: start; }
    .p3 .panel-card { margin: 0; padding: 14px 16px; background: var(--p3-panel); border: 1px solid var(--p3-line); border-radius: 4px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
    .p3 .panel-card h2 { margin: 0; padding: 0; border: 0; font-size: 17px; text-transform: none; letter-spacing: -.15px; }
    .gc-filtros { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .gallery { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; max-height: calc(100vh - 250px); overflow: auto; padding-right: 4px; }
    .p3 .card { display: flex; flex-direction: column; align-items: stretch; gap: 3px; height: auto; min-height: 0; padding: 5px; background: #1d1d1d; border: 1px solid var(--p3-line); border-radius: 4px; color: #eee; white-space: normal; text-align: center; }
    .p3 .card:hover { background: #2a2a2a; border-color: #5a5a5a; }
    .p3 .card.selected { background: #20262f; border-color: var(--p3-accent); }
    .card img { width: 100%; aspect-ratio: 16 / 9; object-fit: contain; display: block; background: repeating-conic-gradient(#222 0% 25%, #161616 0% 50%) 50% / 12px 12px; border-radius: 2px; }
    .card b { font-size: 11.5px; font-weight: 600; line-height: 1.25; }
    .card small { color: var(--p3-dim); font-size: 10.5px; }
    .gc-topo { display: grid; grid-template-columns: minmax(0, 1fr) 170px; gap: 10px; }
    .gc-acoes { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .p3 .gc-acoes .air { background: #b02a1f; border-color: #d8392b; color: #fff; }
    .p3 .gc-acoes .air:hover { background: #c5352a; }
    /* .preview também é a classe de tally verde em controle.css: aqui é o monitor do título, com transparência quadriculada. */
    .p3 #preview.preview { height: 52vh; width: auto; max-width: 100%; aspect-ratio: 16 / 9; margin: 0 auto; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; background: repeating-conic-gradient(#222 0% 25%, #141414 0% 50%) 50% / 20px 20px !important; border: 1px solid var(--p3-line) !important; border-radius: 4px; box-shadow: none !important; color: inherit !important; }
    .p3 label.p3-field { align-items: stretch; text-align: left; }
    .p3 .fields label { align-items: stretch; text-align: left; }
    #link-help { grid-column: 1 / -1; order: 5; }
    .preview svg { width: 100%; height: 100%; display: block; }
    .fields { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px 14px; }
    .fields:empty { display: none; }
    .fields label { display: flex; flex-direction: column; gap: 5px; font-size: 13px; font-weight: 600; color: #ddd; min-width: 0; }
    .fields label:has(textarea) { grid-column: 1 / -1; }
    .fields input[type=color] { width: 100%; height: 34px; padding: 2px; }
    .notice { margin: 0; color: var(--p3-dim); font-size: 12.5px; }
    .notice:empty { display: none; }
    .p3 details { border: 1px solid var(--p3-line); border-radius: 4px; padding: 8px 12px; }
    .p3 details summary { cursor: pointer; font-weight: 600; margin-bottom: 8px; }
    .p3 details:not([open]) summary { margin-bottom: 0; }
    #palette-presets { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
    .p3 #palette-presets button { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 8px; font-size: 12px; font-weight: 500; background: #1d1d1d; border: 1px solid var(--p3-line); color: #ddd; }
    .p3 #palette-presets button:hover { background: #2a2a2a; }
    #palette-presets i { width: 10px; height: 10px; border-radius: 2px; display: block; }
    @media (max-width: 1000px) { .workbench { grid-template-columns: 1fr; } .gallery { max-height: 44vh; } }
  </style>
</head>
<body data-page="gc-library" class="p3">
  <header class="p3-head">
    <a href="/" class="brand-logo" title="3Mix"><img class="p3-logo" src="/img/3mix-logo.png" alt="3Mix"></a>
    <h1>GC e placar</h1>
    <span class="p3-flex"></span>
    <span id="connection" class="p3-badge">Conectando…</span>
  </header>

  <main class="p3-main">
    <div id="message" role="status" aria-live="polite"></div>

    <div class="gc-barra">
      <button id="fresh" type="button" class="primary">Novo título</button>
      <button id="export" type="button">Exportar biblioteca</button>
      <label class="file-input-wrapper">Importar biblioteca<input id="import" type="file" accept="application/json,.json"></label>
      <a href="gc-html.html" class="link-sync">Título em HTML</a>
    </div>
    <div id="saved"></div>

    <div class="workbench">
      <section class="panel-card">
        <h2>Modelos</h2>
        <div class="gc-filtros">
          <label class="p3-field">Grupo
            <select id="collection">
              <option>Todas</option>
              <option>Jornalismo</option>
              <option>Esportes</option>
              <option>Eventos</option>
              <option>Marca</option>
            </select>
          </label>
          <label class="p3-field">Formato
            <select id="orientation">
              <option value="horizontal">Horizontal · 16:9</option>
              <option value="vertical">Vertical · 9:16</option>
            </select>
          </label>
        </div>
        <div id="gallery" class="gallery"></div>
      </section>

      <section class="panel-card">
        <h2 id="model-name">Título</h2>
        <div class="gc-topo">
          <label class="p3-field">Nome na produção<input id="name" maxlength="100"></label>
          <label class="p3-field">Canal de overlay<select id="channel"></select></label>
        </div>
        <div class="gc-acoes">
          <button id="air" class="air" type="button">Colocar no ar</button>
          <button id="off" type="button">Retirar do ar</button>
          <span class="p3-flex"></span>
          <button id="save" type="button" class="primary">Salvar</button>
          <button id="duplicate" type="button">Duplicar</button>
          <button id="prepare" type="button">Criar entrada na mesa</button>
          <button id="remove" type="button">Remover</button>
        </div>
        <p id="status" class="p3-note" role="status"></p>
        <div id="preview" class="preview"></div>
        <div id="fields" class="fields"></div>
        <details>
          <summary>Estilo</summary>
          <div id="palette-presets"></div>
          <div id="style" class="fields"></div>
          <button id="defaults" type="button" style="margin-top:10px">Repor estilo padrão</button>
        </details>
      </section>
    </div>
  </main>

  <script src="controle.js"></script>
  <script type="module" src="gc.js?v=20261102b"></script>
</body>
</html>
