<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>3Mix Studio — conectando</title>
<style>
  :root {
    --app: #141619; --painel: #1b1e22; --linha: #2a2f36;
    --txt: #e4e9ef; --txt-2: #9aa5b1;
    --azul: #2f6fed; --ambar: #e8a33d; --vermelho: #b02a1f;
    --fonte: "Segoe UI Variable Text", "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; background: var(--app); color: var(--txt);
    font-family: var(--fonte); font-size: 13px; display: grid; place-items: center;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    width: min(420px, 92vw); padding: 22px 24px; border-radius: 8px;
    background: var(--painel); border: 1px solid var(--linha);
    box-shadow: 0 8px 28px rgba(0,0,0,.4); text-align: center;
  }
  .marca { display: flex; justify-content: center; gap: 3px; margin-bottom: 14px; }
  .marca i { width: 5px; height: 5px; border-radius: 50%; background: var(--azul); display: inline-block; opacity: .35; }
  .marca i:nth-child(4n+1) { opacity: .9; }
  h1 { font-size: 15px; margin: 0 0 6px; font-weight: 600; letter-spacing: .2px; }
  p { margin: 0 0 4px; color: var(--txt-2); font-size: 12px; line-height: 1.5; }
  .estado { margin-top: 14px; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 12px; }
  .ponto { width: 7px; height: 7px; border-radius: 50%; background: var(--ambar); box-shadow: 0 0 7px rgba(232,163,61,.5); flex: none; }
  .ponto.erro { background: var(--vermelho); box-shadow: 0 0 7px rgba(176,42,31,.5); }
  .ponto.ok { background: #35c05a; box-shadow: 0 0 7px rgba(53,192,90,.5); }
  button {
    margin-top: 16px; font: inherit; font-size: 12px; font-weight: 600; color: #fff;
    background: var(--azul); border: 0; border-radius: 5px; padding: 9px 18px; cursor: pointer;
  }
  button:hover { filter: brightness(1.08); }
  button[hidden] { display: none; }
</style>
</head>
<body>
<div class="card">
  <div class="marca"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <h1>3Mix Studio</h1>
  <p id="texto">Procurando o motor nesta instalação…</p>
  <div class="estado"><span class="ponto" id="ponto"></span><span id="detalhe">tentativa 1 de 3</span></div>
  <button id="btn-retry" hidden>Tentar de novo</button>
  <button id="btn-continuar" hidden>Continuar mesmo assim</button>
</div>
<script>
(function () {
  "use strict";
  // Página-ponte: carregada por file:// pelos docks do OBS (ExtraBrowserDocks).
  // Script clássico — ES modules são bloqueados pelo Chromium em file://.
  // Função única: achar a porta real da API local e redirecionar para a
  // interface nova servida por HTTP (que aí sim pode usar ES modules).
  var texto = document.getElementById("texto");
  var ponto = document.getElementById("ponto");
  var detalhe = document.getElementById("detalhe");
  var btnRetry = document.getElementById("btn-retry");
  var btnContinuar = document.getElementById("btn-continuar");
  var MAX_TENTATIVAS = 3;
  var TIMEOUT_MS = 700;

  function candidatos() {
    var lista = [];
    if (location.protocol.indexOf("http") === 0) lista.push(location.origin);
    lista.push("http://127.0.0.1:8088");
    for (var p = 18188; p <= 18198; p++) lista.push("http://127.0.0.1:" + p);
    var vistos = {}, unicos = [];
    for (var i = 0; i < lista.length; i++) {
      if (!vistos[lista[i]]) { vistos[lista[i]] = true; unicos.push(lista[i]); }
    }
    return unicos;
  }

  // Resolve com um de 3 estados (não um boolean): "ok" (3Mix real respondeu), "ocupada"
  // (algo respondeu nessa porta — conexão TCP aceita, resposta HTTP recebida — mas não é o
  // 3Mix: porta tomada por outro processo) ou "inacessivel" (nada aceitou a conexão, ou
  // nada respondeu dentro do tempo — ninguém escutando ali). Antes os dois casos de falha
  // caíam no mesmo `false` e a mensagem final não conseguia diferenciá-los.
  function saudavel(base) {
    return new Promise(function (resolve) {
      var controller = ("AbortController" in window) ? new AbortController() : null;
      var timer = setTimeout(function () {
        if (controller) controller.abort();
        resolve({ estado: "inacessivel" });
      }, TIMEOUT_MS);
      fetch(base + "/api/health", {
        cache: "no-store",
        signal: controller ? controller.signal : undefined
      }).then(function (r) {
        clearTimeout(timer);
        if (!r.ok) { resolve({ estado: "ocupada" }); return; }
        return r.json().then(function (dados) {
          var valido = dados && (dados.success === true || dados.app === "FreeMix" || dados.app === "3Mix");
          // disk vem de disco-producao.mjs (Fase 3.3: "mensagens acionáveis para disco
          // cheio" na primeira execução, não só no Pre-Flight operacional pós-conexão).
          resolve(valido ? { estado: "ok", disk: dados.disk } : { estado: "ocupada" });
        }, function () {
          resolve({ estado: "ocupada" });
        });
      }).catch(function () {
        clearTimeout(timer);
        resolve({ estado: "inacessivel" });
      });
    });
  }

  function testarTodos() {
    var lista = candidatos();
    return Promise.all(lista.map(function (base) {
      return saudavel(base).then(function (r) { return { base: base, estado: r.estado, disk: r.disk }; });
    })).then(function (resultados) {
      for (var i = 0; i < resultados.length; i++) {
        if (resultados[i].estado === "ok") return { base: resultados[i].base, ocupada: false, disk: resultados[i].disk };
      }
      for (var j = 0; j < resultados.length; j++) {
        if (resultados[j].estado === "ocupada") return { base: null, ocupada: true };
      }
      return { base: null, ocupada: false };
    });
  }

  function falhar(diagnostico) {
    ponto.className = "ponto erro";
    if (diagnostico && diagnostico.ocupada) {
      texto.textContent = "Uma porta do 3Mix está ocupada por outro programa.";
      detalhe.textContent = "Feche o programa que está usando essa porta, ou abra pelo INICIAR-3MIX.cmd.";
    } else {
      texto.textContent = "API do 3Mix não respondeu.";
      detalhe.textContent = "Abra pelo INICIAR-3MIX.cmd e tente de novo.";
    }
    btnRetry.hidden = false;
  }

  function abrirMesa(base) {
    ponto.className = "ponto ok";
    texto.textContent = "Motor encontrado. Abrindo a mesa…";
    location.replace(base + "/estudio/index.html?dock=1");
  }

  // Fase 3.3 ("mensagens acionáveis para: disco cheio"): avisa ANTES de abrir a mesa, não
  // depois — o Pre-Flight operacional já cobre isso uma vez o projeto está em uso, mas até
  // aqui a primeira execução nunca via esse aviso. Nunca bloqueia (disco cheio não impede
  // o motor de funcionar, só a gravação): sempre oferece "Continuar mesmo assim".
  function avisarDiscoOuAbrir(base, disk) {
    if (disk && disk.supported && disk.severity === "CRITICAL") {
      ponto.className = "ponto erro";
      texto.textContent = "Espaço em disco crítico nesta instalação.";
      detalhe.textContent = "Apenas " + disk.freeGb + " GB livres (menos de 1h de gravação). Libere espaço antes de gravar ou transmitir.";
      btnContinuar.hidden = false;
      btnContinuar.onclick = function () { abrirMesa(base); };
      return;
    }
    abrirMesa(base);
  }

  function tentar(numero) {
    detalhe.textContent = "tentativa " + numero + " de " + MAX_TENTATIVAS;
    testarTodos().then(function (resultado) {
      if (resultado.base) { avisarDiscoOuAbrir(resultado.base, resultado.disk); return; }
      if (numero >= MAX_TENTATIVAS) { falhar(resultado); return; }
      setTimeout(function () { tentar(numero + 1); }, 1200);
    });
  }

  btnRetry.addEventListener("click", function () {
    btnRetry.hidden = true;
    ponto.className = "ponto";
    texto.textContent = "Procurando o motor nesta instalação…";
    tentar(1);
  });

  tentar(1);
})();
</script>
</body>
</html>
