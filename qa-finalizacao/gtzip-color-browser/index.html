<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=640,height=360,initial-scale=1"><title>3Mix GT Template</title><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline' file: http://127.0.0.1:* http://localhost:*; style-src 'unsafe-inline'; img-src 'self' file: data: blob:; font-src 'self' file: data:; connect-src 'self' http://127.0.0.1:* http://localhost:* ws://127.0.0.1:* ws://localhost:*"><style>*{box-sizing:border-box;margin:0;padding:0}html,body,#gc-root{width:640px;height:360px;overflow:hidden;background:transparent}#gc-root{position:relative;transform-origin:top left;visibility:hidden}@keyframes ticker-horizontal{from{transform:translateX(640px)}to{transform:translateX(-100%)}}@keyframes ticker-vertical{from{transform:translateY(360px)}to{transform:translateY(-100%)}}@keyframes ticker-template-horizontal{from{transform:translateX(var(--ticker-start))}to{transform:translateX(-100%)}}@keyframes ticker-template-vertical{from{transform:translateY(var(--ticker-start))}to{transform:translateY(-100%)}}</style></head><body><div id="gc-root"><div id="gt-0" class="gt-motion gt-layer" data-name="Direct" data-xml-path="/Composition[1]/Direct" style="position:absolute;left:0px;top:0px;width:640px;height:360px"><div class="gt-content " style="width:100%;height:100%;position:relative;opacity:1;transform:translate(0px,0px) rotate(0deg) scale(1,1);transform-origin:50% 50%"><div id="gt-1" class="gt-motion gt-object" data-name="Headline" data-xml-path="/Composition[1]/TextBlock[1]" style="position:absolute;left:20px;top:20px;width:600px;height:60px"><div class="gt-content gt-text" data-field-name="Headline" style="width:100%;height:100%;position:relative;opacity:1;transform:translate(0px,0px) rotate(0deg) scale(1,1);transform-origin:50% 50%;display:flex;align-items:center;justify-content:flex-start;font-family:&quot;Arial&quot;,Arial,sans-serif;font-size:28px;font-weight:normal;font-style:normal;color:rgba(255,255,255,1);white-space:nowrap;overflow:hidden">Cor dinâmica QA</div></div></div></div></div><script>
const specs=[],fields=[{"id":"Headline","label":"Headline","type":"text","default":"Cor dinâmica QA","path":"/Composition[1]/TextBlock[1]"}],assetMap={};let active=[],timeline={};
function animate(phase){for(const a of active)a.cancel();active=[];document.getElementById('gc-root').style.visibility='visible';for(const a of specs.filter(s=>s.phase===phase)){const el=document.getElementById(a.id);if(!el)continue;el.style.transformOrigin=a.origin;const frames=phase==='TransitionOut'?[a.to,a.from]:[a.from,a.to],animation=el.animate(frames,{duration:a.duration,delay:a.delay,easing:a.easing,fill:'both'});active.push(animation);}if(phase==='TransitionIn'&&Number.isFinite(timeline.animationStartedAt)&&timeline.animationStartedAt>0){const elapsed=Math.max(0,Date.now()-timeline.animationStartedAt);for(const a of active)a.currentTime=elapsed;}if(phase==='TransitionOut'){const end=Math.max(0,...specs.filter(a=>a.phase===phase).map(a=>a.duration+a.delay));Promise.all(active.map(a=>a.finished.catch(()=>null))).then(()=>{if(active.every(a=>a.playState==='finished'))document.getElementById('gc-root').style.visibility='hidden';});if(!active.length)document.getElementById('gc-root').style.visibility='hidden';}}
function update(data){if(!data||typeof data!=='object')return;for(const el of document.querySelectorAll('[data-field-name]')){const key=el.dataset.fieldName;if(el.classList.contains('gt-text')&&!fields.some(f=>f.id===key+'Color')&&Object.hasOwn(data,key+'Color')&&typeof data[key+'Color']==='string'&&/^#[a-f0-9]{6}$/i.test(data[key+'Color']))el.style.color=data[key+'Color'];if(!Object.hasOwn(data,key))continue;const val=String(data[key]??'');if(el.classList.contains('gt-qrcode')){if(window.FreeMixGtQr)window.FreeMixGtQr.render(el,val);else{el.replaceChildren();el.dataset.qrError='QR: encoder local indisponível';}}else if(el.classList.contains('gt-image')){const raw=assetMap[val]||val;if(!raw||raw.split('/').some(p=>p==='..')||/^(?:https?:|javascript:)/i.test(raw))continue;el.style.backgroundImage=['url','(',JSON.stringify(raw),')'].join('');}else if(el.classList.contains('gt-ticker-wrapper')){if(el.dataset.tickerType)window.FreeMixGtTicker.apply({[key]:val});else el.querySelector('.gt-ticker-content').textContent=val;}else if(el.dataset.shrinkMax){el.querySelector('.gt-text-run').textContent=val;fitText(el);}else el.textContent=val;}}
function fitText(el){const run=el.querySelector('.gt-text-run');if(!run)return;const max=Number(el.dataset.shrinkMax),min=Math.min(4,max);let low=min,high=max,best=min;const fits=()=>run.scrollWidth<=el.clientWidth+.5&&run.scrollHeight<=el.clientHeight+.5;el.style.fontSize=max+'px';if(fits()){delete el.dataset.shrinkOverflow;return;}for(let i=0;i<10;i++){const middle=(low+high)/2;el.style.fontSize=middle+'px';if(fits()){best=middle;low=middle;}else high=middle;}el.style.fontSize=best+'px';if(!fits())el.dataset.shrinkOverflow='Texto excede o mínimo local de4px; conteúdo preservado e recortado';else delete el.dataset.shrinkOverflow;}
function fitAllText(){for(const el of document.querySelectorAll('[data-shrink-max]'))fitText(el);}
fitAllText();if(document.fonts?.ready)document.fonts.ready.then(fitAllText);
window.FreeMixTitle={applyTickerData:data=>window.FreeMixGtTicker.apply(data),tickerStatus:()=>window.FreeMixGtTicker?.status()||[],data:fields,updateFields:update,transitionIn(){animate('TransitionIn')},transitionOut(){animate('TransitionOut')},warnings:[]};window.FreeMixGCCompatibility={version:1,animation:true,clock:false,style:false};window.GC={configure(t){timeline={...timeline,...t};if(t?.tickerFps)window.FreeMixGtTicker?.configure(t.tickerFps,Object.fromEntries(fields.filter(f=>f.type==='ticker').map(f=>[f.id,t.initialData?.[f.id]??f.default])))},play(d){update(d);if(document.querySelector('[data-ticker-type]'))window.FreeMixGtTicker.start();animate('TransitionIn')},stop(){window.FreeMixGtTicker?.pause();animate('TransitionOut')},update};window.addEventListener('message',e=>{if(e.source!==window.parent||!e.data)return;if(e.data.action==='UPDATE_FIELDS')update(e.data.payload);if(e.data.action==='TRANSITION_IN')animate('TransitionIn');if(e.data.action==='TRANSITION_OUT')animate('TransitionOut')});
update(Object.fromEntries(fields.filter(f=>f.type==='qrcode').map(f=>[f.id,f.default])));
const clockFormats=new Map(fields.filter(f=>f.type!=='qrcode'&&/^{0:(?:HH|hh):mm(?::ss)?(?: tt)?}$/.test(f.default)).map(f=>[f.id,f.default.slice(3,-1)]));function tickClocks(){const now=new Date();for(const [name,format]of clockFormats){const hour=format.includes('hh')?(now.getHours()%12||12):now.getHours(),text=format.replace(/HH|hh/g,String(hour).padStart(2,'0')).replace('mm',String(now.getMinutes()).padStart(2,'0')).replace('ss',String(now.getSeconds()).padStart(2,'0')).replace('tt',now.getHours()<12?'AM':'PM');for(const el of document.querySelectorAll('[data-field-name]'))if(el.dataset.fieldName===name&&!el.classList.contains('gt-qrcode')){if(el.dataset.shrinkMax){el.querySelector('.gt-text-run').textContent=text;fitText(el);}else el.textContent=text;}}}if(clockFormats.size){tickClocks();setInterval(tickClocks,1000);}
</script><script>(() => {
 const read=()=>{try{return JSON.parse(decodeURIComponent(location.hash.slice(1)))||{}}catch{return {}}};const config=read();let shown=false,leaving=0;
 const configure=timeline=>{if(window.FreeMixGCCompatibility?.version===1&&typeof window.GC?.configure==='function')window.GC.configure({...timeline,initialData:config.d||{}})};
 function show(on,instant=false){if(!window.GC||on===shown)return;shown=on;configure(config.timeline);if(on)window.GC.play(config.d||{});else window.GC.stop();if(instant)requestAnimationFrame(()=>document.getAnimations().filter(a=>a.animationName!=='ticker-horizontal'&&a.animationName!=='ticker-vertical').forEach(a=>{try{a.finish()}catch{}}));}
 window.addEventListener('DOMContentLoaded',()=>{configure(config.timeline);if(window.GC&&config.d)window.GC.update(config.d);if(!window.obsstudio)show(true)});
 window.addEventListener('obsSourceActiveChanged',e=>show(!!e.detail?.active));
 window.addEventListener('freemix-gc',e=>{const m=e.detail||{};if(m.name!==config.n)return;if(m.tickerOperation){const op=m.tickerOperation;let ack={requestId:op.requestId,token:op.token,sourceUuid:op.sourceUuid,titleId:op.titleId,status:'refused',fields:[]};try{config.timeline={...config.timeline,...m.timeline};configure(config.timeline);ack.fields=window.FreeMixTitle.applyTickerData(m.data||{});ack.status='accepted';config.d={...config.d,...m.data};}catch(error){ack.code=error.code||'ERROR';}try{const endpoint=new URL(op.endpoint);if(endpoint.protocol==='http:'&&['127.0.0.1','[::1]'].includes(endpoint.hostname)&&endpoint.pathname==='/api/ticker-ack'&&!endpoint.search&&!endpoint.hash&&!endpoint.username&&!endpoint.password)fetch(endpoint.href,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(ack),signal:AbortSignal.timeout(2000)}).catch(()=>{});}catch{}return;}if(m.timeline){config.timeline=m.timeline;configure(m.timeline)}if(m.data){config.d={...config.d,...m.data};window.GC?.update(config.d)}if(typeof m.show==='boolean'){if(!m.show)leaving=Date.now();if(m.replay===true&&m.show)shown=false;show(m.show)}});
 // Reuse the existing browser data-source event; only this title's named text fields.
 window.addEventListener('freemix-data',e=>{const m=e.detail||{};if(m.name!==config.n||!m.values||typeof m.values!=='object'||Array.isArray(m.values))return;const fields=window.FreeMixTitle?.data||[],values={};for(const field of fields){if(field.type!=='text')continue;const colorKey=field.id+'Color',color=m.values[colorKey];if(!fields.some(f=>f.id===colorKey)&&Object.hasOwn(m.values,colorKey)&&typeof color==='string'&&/^#[a-f0-9]{6}$/i.test(color))values[colorKey]=color;if(!Object.hasOwn(m.values,field.id))continue;const value=m.values[field.id];if(typeof value==='string'&&value.length<=2000&&![...value].some(c=>{const n=c.charCodeAt(0);return n<32&&![9,10,13].includes(n);}))values[field.id]=value;}if(!Object.keys(values).length)return;config.d={...config.d,...values};window.GC?.update(config.d)});
 window.addEventListener('freemix-gc-air',e=>{const names=e.detail?.names||[];if(names.includes(config.n)&&!shown&&Date.now()-leaving>2500)show(true,true)});
})();
