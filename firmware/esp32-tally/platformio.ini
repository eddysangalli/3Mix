[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0

[env:m5stickc-plus]
platform = espressif32
board = m5stick-c
framework = arduino
monitor_speed = 115200
build_flags =
    -D M5STICK_C_PLUS
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
    m5stack/M5StickCPlus @ ^0.1.0

